<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard Chi nhánh - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: branchSidebar('dashboard')}"></nav>

<main class="hc-page">
    <div class="hc-page-inner">
        <div class="mb-6">
            <h1 class="hc-page-title" th:text="'Tổng quan ' + ${branchName}">Tổng quan chi nhánh</h1>
            <p class="hc-page-subtitle">Thống kê tháng này · Cập nhật lúc <span th:text="${lastUpdated}">--:--</span></p>
        </div>

        <section class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-3" aria-label="KPI chi nhánh">
            <div class="hc-card p-5">
                <span class="hc-label">Doanh thu tháng</span>
                <strong class="block text-3xl text-white tabular-nums" th:text="${#numbers.formatInteger(branchRevenue, 0, 'POINT')}">0</strong>
                <span class="text-xs text-cinema-muted">VNĐ</span>
            </div>
            <div class="hc-card p-5">
                <span class="hc-label">Vé đã bán</span>
                <strong class="block text-3xl text-accent tabular-nums" th:text="${branchTickets}">0</strong>
                <span class="text-xs text-cinema-muted">Trong tháng này</span>
            </div>
            <div class="hc-card p-5">
                <span class="hc-label">Booking hôm nay</span>
                <strong class="block text-3xl text-success tabular-nums" th:text="${todayBookings}">0</strong>
                <span class="text-xs text-cinema-muted">Tại chi nhánh</span>
            </div>
        </section>

        <section class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-3" aria-label="Lối tắt">
            <a th:href="@{/admin/halls}" class="hc-card p-5 no-underline transition-colors hover:border-accent">
                <span class="hc-label">Vận hành phòng chiếu</span>
                <strong class="block text-lg text-white">Phòng & ghế</strong>
            </a>
            <a th:href="@{/admin/food-orders}" class="hc-card p-5 no-underline transition-colors hover:border-accent">
                <span class="hc-label">Quầy F&B</span>
                <strong class="block text-lg text-white">Đơn đồ ăn</strong>
            </a>
            <a th:href="@{/admin/vouchers}" class="hc-card p-5 no-underline transition-colors hover:border-accent">
                <span class="hc-label">Khuyến mãi</span>
                <strong class="block text-lg text-white">Voucher</strong>
            </a>
        </section>

        <section class="hc-card overflow-hidden" aria-label="Phim hot tháng này">
            <div class="border-b border-cinema-border p-5">
                <h2 class="text-lg font-semibold text-white">Phim hot tháng này</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="hc-table">
                    <thead>
                    <tr><th>#</th><th>Phim</th><th class="text-right">Booking</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${topMovies == null or #lists.isEmpty(topMovies)}">
                        <td colspan="3" class="py-10 text-center text-cinema-muted">Chưa có dữ liệu</td>
                    </tr>
                    <tr th:each="movie, idx : ${topMovies}">
                        <td th:text="${idx.index + 1}">1</td>
                        <td class="font-semibold text-white" th:text="${movie[0]}">Tên phim</td>
                        <td class="text-right tabular-nums" th:text="${movie[1]}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
