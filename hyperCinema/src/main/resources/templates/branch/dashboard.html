<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Branch Dashboard - HyperCinema')}"></head>
<body class="min-h-screen">
<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: branchSidebar('dashboard')}"></nav>
<main class="md:ml-64 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-1" th:text="'Tổng quan ' + ${branchName}">Tổng quan Chi nhánh</h1>
            <p class="text-sm text-slate-400">Thống kê tháng này · Cập nhật lúc <span th:text="${lastUpdated}">--:--</span></p>
        </div>
        <!-- KPI -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
            <div class="glass-card p-5 flex items-start gap-4 transition-all duration-300 hover:border-white/15 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-warning/15 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                <div class="flex flex-col gap-0.5"><span class="text-2xl font-bold text-white tabular-nums" th:text="${#numbers.formatInteger(branchRevenue, 0, 'COMMA')}">0</span><span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Doanh thu tháng (VNĐ)</span></div>
            </div>
            <div class="glass-card p-5 flex items-start gap-4 transition-all duration-300 hover:border-white/15 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-primary/15 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="flex flex-col gap-0.5"><span class="text-2xl font-bold text-white tabular-nums" th:text="${branchTickets}">0</span><span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Vé đã bán (Tháng này)</span></div>
            </div>
            <div class="glass-card p-5 flex items-start gap-4 transition-all duration-300 hover:border-white/15 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-success/15 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
                <div class="flex flex-col gap-0.5"><span class="text-2xl font-bold text-white tabular-nums" th:text="${todayBookings}">0</span><span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Booking hôm nay</span></div>
            </div>
        </div>
        <!-- Chart -->
        <div class="glass-card p-6 mb-8">
            <h2 class="text-base font-semibold text-white mb-4">Doanh thu 14 ngày qua</h2>
            <div class="relative h-[280px]"><canvas id="revenueChart"></canvas></div>
        </div>
        <!-- Table -->
        <div class="glass-card overflow-hidden mb-8">
            <div class="px-5 py-4 border-b border-white/[0.08] bg-white/[0.02]"><h2 class="text-base font-semibold text-white">Phim Hot (Tháng này)</h2></div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="border-b border-white/[0.08]"><th class="px-5 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">#</th><th class="px-5 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Phim</th><th class="px-5 py-3 text-right text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Booking</th></tr></thead>
                    <tbody class="divide-y divide-white/[0.06]">
                        <tr th:each="movie, idx : ${topMovies}" class="hover:bg-white/[0.04] transition-colors"><td class="px-5 py-3 text-slate-300" th:text="${idx.index + 1}">1</td><td class="px-5 py-3 text-white" th:text="${movie[0]}">Tên phim</td><td class="px-5 py-3 text-right text-slate-400 tabular-nums" th:text="${movie[1]}">0</td></tr>
                        <tr th:if="${#lists.isEmpty(topMovies)}"><td colspan="3" class="px-5 py-10 text-center text-slate-500">Chưa có dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const revenueLabels = /*[[${revenueLabels}]]*/ [];
    const revenueValues = /*[[${revenueValues}]]*/ [];
    new Chart(document.getElementById('revenueChart'), {
        type: 'bar', data: { labels: Array.from(revenueLabels), datasets: [{ label: 'Doanh thu (VNĐ)', data: Array.from(revenueValues), backgroundColor: 'rgba(245,158,11,0.25)', borderColor: '#F59E0B', borderWidth: 2, borderRadius: 8, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx) { return new Intl.NumberFormat('vi-VN').format(ctx.raw) + 'đ'; } } } }, scales: { x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b' } }, y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b', callback: function(val) { if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M'; return val; } } } } }
    });
    /*]]>*/
</script>
</body>
</html>
