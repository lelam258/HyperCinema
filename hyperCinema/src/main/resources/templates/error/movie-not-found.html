<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Không tìm thấy Phim - HyperCinema')}"></head>
<body class="min-h-screen bg-cinema-bg">
<main class="flex min-h-screen items-center justify-center px-6 py-10">
    <section class="hc-card w-full max-w-md p-8 text-center" role="alert" aria-labelledby="error-title">
        <p class="mb-2 text-5xl font-bold text-white" th:text="${status} ?: 404">404</p>
        <h1 class="mb-3 text-xl font-semibold text-white" id="error-title">Không tìm thấy Phim</h1>
        <p class="mb-8 text-sm leading-6 text-cinema-muted" th:text="${errorKey != null} ? #{${errorKey}} : #{movie.not_found}">Không tìm thấy Phim.</p>
        <a class="hc-btn hc-btn-primary no-underline" th:href="@{/admin/movies}">Về danh sách Phim</a>
    </section>
</main>
</body>
</html>
