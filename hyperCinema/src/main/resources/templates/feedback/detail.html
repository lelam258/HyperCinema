<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết ý kiến phản hồi - HyperCinema')}"></head>
<body class="min-h-screen flex flex-col bg-[#050508]">

    <!-- Header / Navbar công cộng -->
    <header class="border-b border-white/[0.06] bg-[#0A0A0F]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-amber-500 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-primary/20">H</div>
                <a th:href="@{/movies}" class="text-xl font-bold bg-gradient-to-r from-primary to-amber-400 bg-clip-text text-transparent tracking-tight no-underline">HyperCinema</a>
            </div>
            <nav class="flex items-center gap-6">
                <a th:href="@{/movies(status='NowShowing')}" class="text-sm font-medium text-slate-300 transition-colors hover:text-primary no-underline">Phim đang chiếu</a>
                <a th:href="@{/movies(status='ComingSoon')}" class="text-sm font-medium text-slate-300 transition-colors hover:text-primary no-underline">Phim sắp chiếu</a>
                <a th:href="@{/feedback}" class="text-sm font-medium text-primary transition-colors hover:text-primary no-underline">Phản hồi khách hàng</a>
            </nav>
            <div class="flex items-center gap-3" th:if="${!isAuthenticated}">
                <a th:href="@{/login}" class="px-4 py-2 text-sm font-semibold text-white bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline">Đăng nhập</a>
                <a th:href="@{/register}" class="px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl hover:shadow-lg hover:shadow-primary/30 transition-all no-underline">Đăng ký</a>
            </div>
            <div class="flex items-center gap-3" th:if="${isAuthenticated}">
                <a th:href="@{/my/dashboard}" class="px-4 py-2 text-sm font-semibold text-white bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline">Tài khoản của tôi</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-6 py-16">

        <div class="mb-6">
            <a th:href="@{/feedback}" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-primary no-underline transition-all">
                &larr; Quay lại danh sách phản hồi
            </a>
        </div>

        <article class="glass-card p-8 md:p-10 flex flex-col gap-6">
            
            <!-- Header: Customer Name and Date -->
            <div class="flex items-center justify-between border-b border-white/[0.06] pb-6 flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary/20 to-amber-500/20 border border-primary/20 flex items-center justify-center text-primary font-bold text-base uppercase"
                         th:text="${#strings.substring(feedback.user.fullName, 0, 1)}">U</div>
                    <div class="flex flex-col">
                        <span class="font-bold text-white text-lg" th:text="${feedback.user.fullName}">Khách hàng</span>
                        <span class="text-xs text-slate-500 font-medium uppercase tracking-wider">Khách hàng HyperCinema</span>
                    </div>
                </div>
                
                <div class="text-right">
                    <span class="block text-xs text-slate-500" th:text="|Ngày gửi: ${#temporals.format(feedback.createdAt, 'HH:mm dd/MM/yyyy')}|">Ngày gửi: 12:34 02/07/2026</span>
                    <span th:if="${feedback.updatedAt != null}" class="block text-xs text-slate-500 mt-1" 
                          th:text="|Cập nhật: ${#temporals.format(feedback.updatedAt, 'HH:mm dd/MM/yyyy')}|">Cập nhật: --:--</span>
                </div>
            </div>

            <!-- Rating Stars -->
            <div class="flex flex-col gap-1.5">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Đánh giá dịch vụ</span>
                <div class="flex items-center gap-1.5 text-warning">
                    <th:block th:each="starIdx : ${#numbers.sequence(1, 5)}">
                        <svg th:class="${starIdx <= feedback.rating} ? 'w-6 h-6 fill-current' : 'w-6 h-6 text-slate-700'" viewBox="0 0 24 24">
                            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                        </svg>
                    </th:block>
                    <span class="text-white text-sm font-bold ml-2 tabular-nums" th:text="${feedback.rating} + ' / 5 Sao'">5 / 5 Sao</span>
                </div>
            </div>

            <!-- Feedback comment -->
            <div class="flex flex-col gap-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Ý kiến & Góp ý</span>
                <div class="bg-white/[0.02] border border-white/[0.04] rounded-2xl p-6">
                    <p class="text-slate-200 text-base leading-relaxed whitespace-pre-wrap" th:text="${feedback.comment}">Nội dung chi tiết...</p>
                </div>
            </div>

            <!-- Footer of card: Edit button for owner -->
            <div th:if="${isAuthenticated and currentUserId == feedback.user.userId}"
                 class="flex justify-end pt-4 border-t border-white/[0.06]">
                <a th:href="@{|/my/feedback/${feedback.feedbackId}/edit|}" 
                   class="inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-primary to-amber-500 rounded-xl text-sm font-semibold text-white transition-all duration-300 hover:shadow-lg hover:shadow-primary/20 no-underline cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>
                    Chỉnh sửa ý kiến
                </a>
            </div>

        </article>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
