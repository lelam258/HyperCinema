<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lịch sử đóng góp ý kiến - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: customerSidebar('feedback')}"></nav>

<!-- Main Content -->
<main class="md:ml-64 min-h-screen flex flex-col bg-[#050508]">
    <div class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">

        <!-- Welcoming Alert / Flashes -->
        <div th:replace="~{fragments/components :: flashes}"></div>

        <!-- Page Header -->
        <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="font-sans">
                <h1 class="text-3xl font-bold text-white tracking-tight mb-1">Ý kiến & Đóng góp của tôi</h1>
                <p class="text-sm text-slate-400">Xem và chỉnh sửa các ý kiến đóng góp của bạn gửi tới HyperCinema.</p>
            </div>
            <div>
                <a th:href="@{/my/feedback/new}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary to-amber-500 rounded-xl text-sm font-semibold text-white transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 no-underline cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    Gửi đóng góp mới
                </a>
            </div>
        </div>

        <!-- Feedback History List -->
        <div th:if="${#lists.isEmpty(feedbacks)}" class="text-center py-16 glass-card max-w-2xl mx-auto">
            <svg class="w-16 h-16 text-slate-600 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z"/>
            </svg>
            <h3 class="text-lg font-bold text-slate-300">Bạn chưa gửi đóng góp ý kiến nào</h3>
            <p class="text-slate-500 text-sm mt-1">Phản hồi của bạn sẽ giúp chúng tôi nâng cấp dịch vụ tốt hơn.</p>
        </div>

        <div th:unless="${#lists.isEmpty(feedbacks)}" class="grid grid-cols-1 gap-4 max-w-4xl">
            <div th:each="item : ${feedbacks}" class="glass-card p-6 flex flex-col gap-3 transition-all duration-300 hover:border-white/12">
                <div class="flex items-center justify-between gap-4 flex-wrap">
                    <!-- Rating Stars -->
                    <div class="flex items-center gap-1 text-warning">
                        <th:block th:each="starIdx : ${#numbers.sequence(1, 5)}">
                            <svg th:class="${starIdx <= item.rating} ? 'w-4 h-4 fill-current' : 'w-4 h-4 text-slate-700'" viewBox="0 0 24 24">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                            </svg>
                        </th:block>
                        <span class="text-white text-xs font-bold ml-1.5" th:text="${item.rating} + ' / 5'">5 / 5</span>
                    </div>
                    
                    <!-- Created date -->
                    <span class="text-slate-500 text-xs tabular-nums" 
                          th:text="|Gửi ngày: ${#temporals.format(item.createdAt, 'HH:mm dd/MM/yyyy')}|">Gửi ngày: --:--</span>
                </div>

                <!-- Comment text -->
                <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap" th:text="${item.comment}">Nội dung...</p>
                
                <div class="flex items-center justify-between border-t border-white/[0.04] pt-3 mt-1 flex-wrap gap-2 text-xs">
                    <div>
                        <span th:if="${item.updatedAt != null}" class="text-slate-500"
                              th:text="|Cập nhật lần cuối: ${#temporals.format(item.updatedAt, 'HH:mm dd/MM/yyyy')}|">Cập nhật lúc...</span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <a th:href="@{|/feedback/${item.feedbackId}|}" class="px-3 py-1.5 rounded-lg border border-white/10 text-slate-400 hover:text-white hover:bg-white/5 no-underline transition-all">
                            Xem chi tiết
                        </a>
                        <a th:href="@{|/my/feedback/${item.feedbackId}/edit|}" class="px-3 py-1.5 rounded-lg bg-white/[0.06] border border-white/10 text-slate-200 hover:text-white hover:bg-white/10 hover:border-white/20 no-underline transition-all flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>
                            Chỉnh sửa
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
