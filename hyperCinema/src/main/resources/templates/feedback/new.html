<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gửi ý kiến đóng góp - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: customerSidebar('feedback')}"></nav>

<!-- Main Content -->
<main class="md:ml-64 min-h-screen flex flex-col bg-[#050508]">
    <div class="max-w-3xl mx-auto px-6 py-8 flex-grow w-full">

        <!-- Page Header -->
        <div class="mb-8 font-sans">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-1">Gửi đóng góp ý kiến</h1>
            <p class="text-sm text-slate-400">Chia sẻ trải nghiệm và đóng góp ý kiến của bạn để giúp chúng tôi hoàn thiện chất lượng dịch vụ.</p>
        </div>

        <!-- Feedback Form -->
        <div class="glass-card p-6 md:p-8">
            <form th:action="@{/my/feedback/new}" th:object="${feedbackForm}" method="post" class="space-y-6">
                
                <!-- 1. Star Rating Widget -->
                <div class="flex flex-col gap-2">
                    <label class="block text-sm font-semibold text-slate-300 uppercase tracking-wider">Đánh giá của bạn <span class="text-red-500">*</span></label>
                    <input type="hidden" id="ratingInput" th:field="*{rating}" />
                    
                    <div class="flex items-center gap-2 py-2" id="star-rating-container">
                        <button type="button" class="star-btn focus:outline-none cursor-pointer text-slate-600 hover:scale-110 transition-transform duration-150" data-value="1">
                            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                        <button type="button" class="star-btn focus:outline-none cursor-pointer text-slate-600 hover:scale-110 transition-transform duration-150" data-value="2">
                            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                        <button type="button" class="star-btn focus:outline-none cursor-pointer text-slate-600 hover:scale-110 transition-transform duration-150" data-value="3">
                            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                        <button type="button" class="star-btn focus:outline-none cursor-pointer text-slate-600 hover:scale-110 transition-transform duration-150" data-value="4">
                            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                        <button type="button" class="star-btn focus:outline-none cursor-pointer text-slate-600 hover:scale-110 transition-transform duration-150" data-value="5">
                            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                    </div>
                    
                    <!-- Display validation error for rating -->
                    <span th:if="${#fields.hasErrors('rating')}" class="text-xs text-danger" th:errors="*{rating}">Lỗi đánh giá</span>
                </div>

                <!-- 2. Text comment field -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label for="comment" class="block text-sm font-semibold text-slate-300 uppercase tracking-wider">Ý kiến / Góp ý của bạn <span class="text-red-500">*</span></label>
                        <span id="char-count" class="text-xs text-slate-500">0 / 1000 ký tự</span>
                    </div>
                    
                    <textarea id="comment" th:field="*{comment}" rows="6" maxlength="1000"
                              placeholder="Hãy mô tả chi tiết trải nghiệm của bạn tại rạp chiếu phim, ý kiến đóng góp hoặc đề xuất cải tiến dịch vụ..."
                              class="w-full px-4 py-3 bg-white/[0.04] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-y min-h-[120px]"></textarea>
                    
                    <!-- Display validation error for comment -->
                    <span th:if="${#fields.hasErrors('comment')}" class="text-xs text-danger" th:errors="*{comment}">Lỗi nội dung ý kiến</span>
                </div>

                <!-- 3. Form actions -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/[0.06]">
                    <a th:href="@{/my/feedback}" class="px-5 py-2.5 text-sm font-semibold text-slate-300 bg-white/[0.04] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline cursor-pointer">Hủy</a>
                    <button type="submit" class="px-6 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer">Gửi đóng góp</button>
                </div>

            </form>
        </div>

    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

<!-- Star rating and Character counting logic -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Star rating widget
        const container = document.getElementById('star-rating-container');
        const stars = container.querySelectorAll('.star-btn');
        const ratingInput = document.getElementById('ratingInput');

        function updateStars(val) {
            stars.forEach(star => {
                const starVal = parseInt(star.getAttribute('data-value'));
                if (starVal <= val) {
                    star.classList.remove('text-slate-600');
                    star.classList.add('text-warning');
                } else {
                    star.classList.remove('text-warning');
                    star.classList.add('text-slate-600');
                }
            });
        }

        // Prefill rating if exist
        if (ratingInput.value) {
            updateStars(parseInt(ratingInput.value));
        }

        stars.forEach(star => {
            star.addEventListener('click', function() {
                const val = this.getAttribute('data-value');
                ratingInput.value = val;
                updateStars(parseInt(val));
            });

            star.addEventListener('mouseenter', function() {
                const val = parseInt(this.getAttribute('data-value'));
                stars.forEach(s => {
                    const sVal = parseInt(s.getAttribute('data-value'));
                    if (sVal <= val) {
                        s.classList.add('text-amber-400');
                        s.classList.remove('text-slate-600', 'text-warning');
                    } else {
                        s.classList.remove('text-amber-400', 'text-warning');
                        s.classList.add('text-slate-600');
                    }
                });
            });
        });

        container.addEventListener('mouseleave', function() {
            const val = parseInt(ratingInput.value) || 0;
            updateStars(val);
        });

        // Character counting
        const textarea = document.getElementById('comment');
        const charCount = document.getElementById('char-count');

        function updateCharCount() {
            const len = textarea.value.length;
            charCount.textContent = `${len} / 1000 ký tự`;
            if (len >= 900) {
                charCount.classList.remove('text-slate-500');
                charCount.classList.add('text-warning');
            } else {
                charCount.classList.remove('text-warning');
                charCount.classList.add('text-slate-500');
            }
        }

        textarea.addEventListener('input', updateCharCount);
        updateCharCount(); // initial call
    });
</script>

</body>
</html>
