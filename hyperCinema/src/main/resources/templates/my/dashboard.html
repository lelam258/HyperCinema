<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tài khoản của tôi - HyperCinema')}">
    <title>Tài khoản của tôi - HyperCinema</title>
</head>
<body class="min-h-screen">
<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: customerSidebar('dashboard')}"></nav>
<main class="md:ml-64 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-1" th:text="'Xin chào, ' + ${customerName}">Xin chào, Khách hàng</h1>
            <p class="text-sm text-slate-400">Quản lý thông tin tài khoản và lịch sử đặt vé</p>
        </div>
        <!-- KPI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
            <div class="glass-card p-5 flex items-start gap-4 transition-all duration-300 hover:border-white/15 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-primary/15 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                <div class="flex flex-col gap-0.5"><span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Hạng thành viên</span><span class="text-2xl font-bold text-warning tabular-nums" th:text="${membershipTier}">Vàng</span></div>
            </div>
            <div class="glass-card p-5 flex items-start gap-4 transition-all duration-300 hover:border-white/15 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-warning/15 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
                <div class="flex flex-col gap-0.5"><span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Điểm thưởng</span><span class="text-2xl font-bold text-white tabular-nums" th:text="${rewardPoints}">0</span></div>
            </div>
        </div>
        <!-- Quick Actions -->
        <div class="mb-8">
            <h2 class="text-base font-semibold text-white mb-4">Tiện ích</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <a th:href="@{/my/profile}" class="glass-card p-5 flex items-center gap-4 cursor-pointer no-underline transition-all duration-300 hover:border-primary/50 hover:bg-white/[0.06] group">
                    <div class="w-10 h-10 rounded-xl bg-info/15 flex items-center justify-center shrink-0 group-hover:bg-info/25 transition-colors"><svg class="w-5 h-5 text-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
                    <span class="text-sm font-medium text-white">Cập nhật thông tin</span>
                </a>
                <a th:href="@{/my/bookings}" class="glass-card p-5 flex items-center gap-4 cursor-pointer no-underline transition-all duration-300 hover:border-primary/50 hover:bg-white/[0.06] group">
                    <div class="w-10 h-10 rounded-xl bg-primary/15 flex items-center justify-center shrink-0 group-hover:bg-primary/25 transition-colors"><svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                    <span class="text-sm font-medium text-white">Lịch sử đặt vé</span>
                </a>
                <a th:href="@{/}" class="glass-card p-5 flex items-center gap-4 cursor-pointer no-underline transition-all duration-300 hover:border-primary/50 hover:bg-white/[0.06] group">
                    <div class="w-10 h-10 rounded-xl bg-success/15 flex items-center justify-center shrink-0 group-hover:bg-success/25 transition-colors"><svg class="w-5 h-5 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
                    <span class="text-sm font-medium text-white">Đặt vé ngay</span>
                </a>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
</body>
</html>
