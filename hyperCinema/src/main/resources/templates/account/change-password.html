<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Doi mat khau - HyperCinema')}"></head>
<body class="min-h-screen bg-cinema-bg">

<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="hc-card w-full max-w-md p-8" aria-labelledby="changePasswordTitle">
        <div class="mb-8 text-center">
            <h1 id="changePasswordTitle" class="font-serif text-3xl font-bold text-white">Doi mat khau</h1>
            <p class="mt-2 text-sm text-cinema-muted">Cap nhat mat khau dang nhap cua ban</p>
        </div>

        <div th:if="${successMessage}" class="mb-4 rounded-lg border border-success/30 bg-success/10 px-4 py-3 text-sm text-success" th:text="${successMessage}"></div>

        <form th:action="@{/account/change-password}" th:object="${changePasswordDTO}" method="post" class="space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Khong the doi mat khau.</p>
            </div>
            <div>
                <label for="currentPassword" class="hc-label">Mat khau hien tai</label>
                <input class="hc-input" type="password" id="currentPassword" th:field="*{currentPassword}" required autofocus autocomplete="current-password">
                <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="newPassword" class="hc-label">Mat khau moi</label>
                <input class="hc-input" type="password" id="newPassword" th:field="*{newPassword}" required autocomplete="new-password">
                <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="confirmPassword" class="hc-label">Xac nhan mat khau moi</label>
                <input class="hc-input" type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password">
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <button type="submit" class="hc-btn hc-btn-primary w-full">Cap nhat mat khau</button>
        </form>

        <div class="mt-6 text-center text-sm text-cinema-muted">
            <a th:href="${dashboardUrl}" class="text-accent no-underline hover:text-yellow-300">Quay lai trang cua toi</a>
        </div>
    </section>
</main>

</body>
</html>
