<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu - HyperCinema')}"></head>
<body class="min-h-screen bg-cinema-bg">

<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="hc-card w-full max-w-md p-8" aria-labelledby="resetTitle">
        <div class="mb-8 text-center">
            <h1 id="resetTitle" class="font-serif text-3xl font-bold text-white">Đặt lại mật khẩu</h1>
            <p class="mt-2 text-sm text-cinema-muted">Nhập mã xác nhận và mật khẩu mới</p>
        </div>

        <div th:if="${errorMessage}" class="mb-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post" class="space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="email" class="hc-label">Email</label>
                <input class="hc-input" type="email" id="email" th:field="*{email}" required autofocus autocomplete="email">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="code" class="hc-label">Mã xác nhận</label>
                <input class="hc-input" type="text" id="code" th:field="*{code}" required autocomplete="one-time-code">
                <span th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="password" class="hc-label">Mật khẩu mới</label>
                <input class="hc-input" type="password" id="password" th:field="*{password}" required autocomplete="new-password">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="confirmPassword" class="hc-label">Xác nhận mật khẩu mới</label>
                <input class="hc-input" type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password">
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <button type="submit" class="hc-btn hc-btn-primary w-full">Cập nhật mật khẩu</button>
        </form>

        <div class="mt-6 space-y-2 text-center text-sm text-cinema-muted">
            <a th:href="@{/forgot-password}" class="text-accent no-underline hover:text-yellow-300">Gửi lại mã xác nhận</a>
            <p><a th:href="@{/login}" class="text-accent no-underline hover:text-yellow-300">Quay lại đăng nhập</a></p>
        </div>
    </section>
</main>

</body>
</html>
