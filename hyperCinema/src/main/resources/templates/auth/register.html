<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký - HyperCinema')}"></head>
<body class="min-h-screen bg-cinema-bg">

<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="hc-card w-full max-w-lg p-8" aria-labelledby="registerTitle">
        <div class="mb-8 text-center">
            <h1 id="registerTitle" class="font-serif text-3xl font-bold text-white">Tạo tài khoản</h1>
            <p class="mt-2 text-sm text-cinema-muted">HyperCinema</p>
        </div>

        <div th:if="${errorMessage}" class="mb-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" th:text="${errorMessage}">Lỗi đăng ký</div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="space-y-4">
            <div>
                <label for="fullName" class="hc-label">Họ và tên</label>
                <input class="hc-input" type="text" id="fullName" th:field="*{fullName}" required autocomplete="name">
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="email" class="hc-label">Email</label>
                <input class="hc-input" type="email" id="email" th:field="*{email}" required autocomplete="email">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div>
                <label for="username" class="hc-label">Tên đăng nhập</label>
                <input class="hc-input" type="text" id="username" th:field="*{username}" required autocomplete="username">
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label for="password" class="hc-label">Mật khẩu</label>
                    <input class="hc-input" type="password" id="password" th:field="*{password}" required autocomplete="new-password">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 block text-xs text-danger"></span>
                </div>
                <div>
                    <label for="confirmPassword" class="hc-label">Xác nhận mật khẩu</label>
                    <input class="hc-input" type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 block text-xs text-danger"></span>
                </div>
            </div>
            <div>
                <label for="phone" class="hc-label">Số điện thoại</label>
                <input class="hc-input" type="text" id="phone" th:field="*{phone}" autocomplete="tel">
            </div>
            <button type="submit" class="hc-btn hc-btn-primary w-full">Đăng ký</button>
        </form>

        <p class="mt-6 text-center text-sm text-cinema-muted">Đã có tài khoản? <a th:href="@{/login}" class="font-medium text-accent no-underline hover:text-yellow-300">Đăng nhập ngay</a></p>
    </section>
</main>

</body>
</html>
