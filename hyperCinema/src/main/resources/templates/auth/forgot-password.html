<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu - HyperCinema')}"></head>
<body class="min-h-screen bg-cinema-bg">

<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="hc-card w-full max-w-md p-8" aria-labelledby="forgotTitle">
        <div class="mb-8 text-center">
            <h1 id="forgotTitle" class="font-serif text-3xl font-bold text-white">Quên mật khẩu</h1>
            <p class="mt-2 text-sm text-cinema-muted">Nhập email tài khoản</p>
        </div>

        <div th:if="${errorMessage}" class="mb-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="mb-4 rounded-lg border border-success/30 bg-success/10 px-4 py-3 text-sm text-success" th:text="${successMessage}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post" class="space-y-5">
            <div>
                <label for="email" class="hc-label">Email tài khoản</label>
                <input class="hc-input" type="email" id="email" th:field="*{email}" required autofocus autocomplete="email">
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 block text-xs text-danger"></span>
            </div>
            <button type="submit" class="hc-btn hc-btn-primary w-full">Gửi mã xác nhận</button>
        </form>

        <div class="mt-6 space-y-2 text-center text-sm text-cinema-muted">
            <a th:href="@{/reset-password}" class="text-accent no-underline hover:text-yellow-300">Đã có mã? Đặt lại mật khẩu</a>
            <p><a th:href="@{/login}" class="text-accent no-underline hover:text-yellow-300">Quay lại đăng nhập</a></p>
        </div>
    </section>
</main>

</body>
</html>
