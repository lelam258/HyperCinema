<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trang quản trị - HyperCinema')}"></head>
<body>
    <div class="hc-shell">
        <th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
        <nav th:replace="~{fragments/layout :: adminSidebar('home')}"></nav>

        <main class="hc-page">
            <section class="hc-page-head">
                <div>
                    <p class="hc-kicker">Admin</p>
                    <h1>Trang quản trị</h1>
                    <p>Chọn khu vực quản lý để tiếp tục công việc.</p>
                </div>
                <a class="hc-button hc-button-primary" th:href="@{/admin/dashboard}">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>
            </section>

            <section class="hc-action-grid" aria-label="Muc quan tri">
                <a class="hc-action-card" th:href="@{/admin/branches}">
                    <i data-lucide="building-2"></i>
                    <span>Chi nhánh</span>
                </a>
                <a class="hc-action-card" th:href="@{/admin/movies}">
                    <i data-lucide="clapperboard"></i>
                    <span>Phim</span>
                </a>
                <a class="hc-action-card" th:href="@{/admin/users}">
                    <i data-lucide="users"></i>
                    <span>Người dùng</span>
                </a>
                <a class="hc-action-card" th:href="@{/admin/vouchers}">
                    <i data-lucide="badge-percent"></i>
                    <span>Voucher</span>
                </a>
                <a class="hc-action-card" th:href="@{/admin/food-items}">
                    <i data-lucide="popcorn"></i>
                    <span>F&amp;B</span>
                </a>
                <a class="hc-action-card" th:href="@{/admin/logs}">
                    <i data-lucide="activity"></i>
                    <span>Nhật ký</span>
                </a>
            </section>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
