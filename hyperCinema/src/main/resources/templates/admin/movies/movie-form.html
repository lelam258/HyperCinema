<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? 'Chỉnh sửa Phim - HyperCinema' : 'Tạo Phim - HyperCinema')}"></head>
<body>
<div class="hc-shell">
    <th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
    <nav th:replace="~{fragments/layout :: adminSidebar('movies')}"></nav>

    <main class="hc-page">
        <nav class="hc-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/admin/movies}">Phim</a>
            <span>/</span>
            <strong th:text="${mode == 'edit'} ? 'Chỉnh sửa' : 'Tạo mới'">Tạo mới</strong>
        </nav>

        <section class="hc-page-head">
            <div>
                <p class="hc-kicker">Movie catalog</p>
                <h1 th:text="${mode == 'edit'} ? 'Chỉnh sửa phim' : 'Tạo phim mới'">Tạo phim mới</h1>
                <p>Quản lý thông tin phát hành, poster Cloudinary, trailer và thể loại.</p>
            </div>
            <div class="hc-actions">
                <a th:href="${mode == 'edit'} ? @{|/admin/movies/${movieId}|} : @{/admin/movies}" class="hc-button hc-button-outline">
                    <i data-lucide="arrow-left"></i>
                    Quay lại
                </a>
            </div>
        </section>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <section class="hc-panel">
            <div class="hc-panel-head">
                <div>
                    <p class="hc-kicker" th:text="${mode == 'edit'} ? 'Cập nhật' : 'Tạo mới'">Tạo mới</p>
                    <h2>Thông tin phim</h2>
                </div>
                <i data-lucide="clapperboard"></i>
            </div>

            <form th:object="${movie}"
                  th:action="${mode == 'edit'} ? @{|/admin/movies/${movieId}|} : @{/admin/movies}"
                  method="post"
                  enctype="multipart/form-data"
                  novalidate
                  class="hc-stack"
                  data-movie-form
                  th:data-poster-upload-url="@{/admin/movies/poster-upload}">

                <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
                    <strong>Không thể lưu phim:</strong>
                    <ul class="mt-2 list-disc space-y-1 pl-5">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">global error</li>
                    </ul>
                </div>

                <div class="hc-movie-form-layout">
                    <div class="hc-movie-form-main">
                        <label class="hc-field" for="title">
                            <span>Tên phim</span>
                            <input class="hc-input" type="text" id="title" th:field="*{title}" maxlength="255" autocomplete="off" required
                                   th:classappend="${#fields.hasErrors('title')} ? ' border-danger!' : ''">
                            <small th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-xs text-danger"></small>
                        </label>

                        <div class="hc-form-grid">
                            <label class="hc-field" for="duration">
                                <span>Thời lượng</span>
                                <input class="hc-input" type="number" id="duration" th:field="*{duration}" min="1" max="600" required
                                       th:classappend="${#fields.hasErrors('duration')} ? ' border-danger!' : ''">
                                <small th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" class="text-xs text-danger"></small>
                            </label>

                            <label class="hc-field" for="releaseDate">
                                <span>Ngày phát hành</span>
                                <input class="hc-input" type="date" id="releaseDate" th:field="*{releaseDate}" required
                                       th:classappend="${#fields.hasErrors('releaseDate')} ? ' border-danger!' : ''">
                                <small th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}" class="text-xs text-danger"></small>
                            </label>
                        </div>

                        <label class="hc-field" for="description">
                            <span>Mô tả</span>
                            <textarea class="hc-input hc-movie-description" id="description" th:field="*{description}" maxlength="5000" rows="7" required
                                      th:classappend="${#fields.hasErrors('description')} ? ' border-danger!' : ''"></textarea>
                            <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-xs text-danger"></small>
                        </label>

                        <div class="hc-form-grid">
                            <label class="hc-field" for="languageId">
                                <span>Ngôn ngữ</span>
                                <select class="hc-input cursor-pointer" id="languageId" th:field="*{languageId}" required
                                        th:classappend="${#fields.hasErrors('languageId')} ? ' border-danger!' : ''">
                                    <option value="">Chọn ngôn ngữ</option>
                                    <option th:each="lang : ${languages}" th:value="${lang.languageId}" th:text="${lang.name}">Tiếng Việt</option>
                                </select>
                                <small th:if="${#fields.hasErrors('languageId')}" th:errors="*{languageId}" class="text-xs text-danger"></small>
                            </label>

                            <label class="hc-field" for="trailerUrl">
                                <span>URL trailer</span>
                                <input class="hc-input" type="url" id="trailerUrl" th:field="*{trailerUrl}" placeholder="https://..." maxlength="500" autocomplete="off"
                                       th:classappend="${#fields.hasErrors('trailerUrl')} ? ' border-danger!' : ''">
                                <small th:if="${#fields.hasErrors('trailerUrl')}" th:errors="*{trailerUrl}" class="text-xs text-danger"></small>
                            </label>
                        </div>
                    </div>

                    <aside class="hc-movie-form-side">
                        <div class="hc-movie-poster-uploader">
                            <div class="hc-movie-poster-preview">
                                <img th:if="*{posterUrl != null and not #strings.isEmpty(posterUrl)}"
                                     th:src="*{posterUrl}"
                                     alt="Poster phim"
                                     data-movie-poster-preview>
                                <div th:unless="*{posterUrl != null and not #strings.isEmpty(posterUrl)}"
                                     class="hc-movie-poster-placeholder"
                                     data-movie-poster-empty>
                                    <i data-lucide="image"></i>
                                    <span>Poster</span>
                                </div>
                            </div>

                            <input type="hidden" id="posterUrl" th:field="*{posterUrl}" data-movie-poster-url>

                            <label class="hc-field" for="posterFile">
                                <span>Upload poster</span>
                                <input class="hc-input cursor-pointer" type="file" id="posterFile" name="posterFile" accept="image/*"
                                       th:classappend="${#fields.hasErrors('posterFile')} ? ' border-danger!' : ''"
                                       data-movie-poster-input>
                                <small th:if="${#fields.hasErrors('posterFile')}" th:errors="*{posterFile}" class="text-xs text-danger"></small>
                                <small class="hc-movie-upload-status" data-movie-poster-status></small>
                                <small th:if="${#fields.hasErrors('posterUrl')}" th:errors="*{posterUrl}" class="text-xs text-danger"></small>
                            </label>
                        </div>

                        <div class="hc-field">
                            <span>Thể loại</span>
                            <div class="hc-genre-picker" th:classappend="${#fields.hasErrors('genreIds')} ? ' border-danger!' : ''">
                                <label class="hc-genre-pill" th:each="g : ${genres}">
                                    <input type="checkbox" name="genreIds" th:value="${g.genreId}" th:checked="${movie.genreIds != null and #lists.contains(movie.genreIds, g.genreId)}">
                                    <span th:text="${g.name}">Thể loại</span>
                                </label>
                                <span th:if="${genres == null or #lists.isEmpty(genres)}" class="text-sm text-cinema-muted">Chưa có thể loại nào.</span>
                            </div>
                            <small class="hc-muted">Tối đa 10 thể loại.</small>
                            <small th:if="${#fields.hasErrors('genreIds')}" th:errors="*{genreIds}" class="text-xs text-danger"></small>
                        </div>
                    </aside>
                </div>

                <div class="hc-actions border-t border-cinema-border pt-5">
                    <a th:href="${mode == 'edit'} ? @{|/admin/movies/${movieId}|} : @{/admin/movies}" class="hc-button hc-button-outline">Hủy</a>
                    <button type="submit" class="hc-button hc-button-primary">
                        <i data-lucide="save"></i>
                        <span th:text="${mode == 'edit'} ? 'Lưu thay đổi' : 'Tạo phim'">Tạo phim</span>
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script defer th:src="@{/js/features/movie-form.js(v=1.0)}"></script>
</body>
</html>
