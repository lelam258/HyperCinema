<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|Phân phối Phim tới Chi nhánh: ${movie.title} - HyperCinema|)}"></head>
<body class="min-h-screen bg-cinema-bg text-white">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('movies')}"></nav>

<main class="hc-page">
    <div class="mx-auto max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <nav class="mb-6 flex items-center gap-2 text-sm text-cinema-muted" aria-label="Breadcrumb">
            <a th:href="@{/admin/movies}" class="text-cinema-muted no-underline hover:text-accent">Quản lý Phim</a>
            <span>/</span>
            <a th:href="@{/admin/movies/{id}(id=${movie.movieId})}" th:text="${movie.title}" class="text-cinema-muted no-underline hover:text-accent">Tên phim</a>
            <span>/</span>
            <span class="text-white">Phân phối</span>
        </nav>

        <div class="mb-8">
            <h1 class="hc-page-title" th:text="|Phân phối Phim: ${movie.title}|">Phân phối Phim tới Chi nhánh</h1>
            <p class="hc-page-subtitle">
                Trạng thái:
                <th:block th:replace="~{fragments/components :: statusBadge(${movie.status})}"></th:block>
            </p>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <form method="post" th:action="@{|/admin/movies/${movie.movieId}/branches|}" class="space-y-5">
            <section class="hc-card p-6">
                <div class="mb-5 flex items-center justify-between gap-3 border-b border-cinema-border pb-4">
                    <h2 class="font-serif text-lg text-white">Chi nhánh chưa được phân phối</h2>
                    <span class="hc-badge border-cinema-border bg-cinema-panel-soft text-cinema-muted" th:text="|${candidates != null ? #lists.size(candidates) : 0} chi nhánh|">0 chi nhánh</span>
                </div>

                <div th:if="${candidates == null or #lists.isEmpty(candidates)}" class="rounded-xl border border-dashed border-cinema-border bg-cinema-panel-soft px-4 py-10 text-center text-sm text-cinema-muted">
                    Tất cả chi nhánh đã được phân phối hoặc chưa có chi nhánh.
                </div>

                <div th:if="${candidates != null and !#lists.isEmpty(candidates)}">
                    <label for="branchId" class="hc-label">Chọn Chi nhánh</label>
                    <select id="branchId" name="branchId" required class="hc-input cursor-pointer">
                        <option value="" disabled selected>-- Chọn một chi nhánh --</option>
                        <option th:each="candidate : ${candidates}"
                                th:value="${candidate.branchId}"
                                th:text="|${candidate.name} - ${candidate.city}|">
                            Tên chi nhánh - Thành phố
                        </option>
                    </select>
                    <span class="mt-2 block text-xs text-cinema-muted">Chỉ hiển thị các chi nhánh chưa được phân phối phim này.</span>
                </div>
            </section>

            <div class="flex justify-end gap-3">
                <a class="hc-btn no-underline" th:href="@{/admin/movies/{id}(id=${movie.movieId})}">Hủy</a>
                <button type="submit" class="hc-btn hc-btn-primary" th:disabled="${candidates == null or #lists.isEmpty(candidates)}">Phân phối</button>
            </div>
        </form>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
