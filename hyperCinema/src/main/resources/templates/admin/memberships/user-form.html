<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thành viên khách hàng - HyperCinema')}"></head>
<body class="min-h-screen">
<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('memberships')}"></nav>
<main class="hc-page hc-admin-page">
    <header class="hc-admin-topbar">
        <nav class="hc-admin-crumb" aria-label="Breadcrumb">
            <a th:href="@{/admin/memberships/users}">Thành viên khách hàng</a>
            <span>/</span>
            <strong th:text="${mode == 'edit' ? 'Sửa gói thành viên' : 'Gán gói thành viên'}">Thành viên</strong>
        </nav>
    </header>
    <div class="hc-page-inner max-w-3xl">
        <h1 class="text-3xl font-bold text-white" th:text="${mode == 'edit' ? 'Sửa gói thành viên của khách hàng' : 'Gán gói thành viên'}">Thành viên</h1>
        <div th:replace="~{fragments/components :: flashes}"></div>
        <form class="mt-6 space-y-5 rounded-xl border border-cinema-border bg-cinema-panel p-6"
              th:object="${membership}"
              th:action="${mode == 'edit'} ? @{|/admin/memberships/users/${membershipId}|} : @{/admin/memberships/users}"
              method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg border border-danger/30 bg-danger/10 p-3 text-sm text-danger">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</p>
            </div>
            <div th:if="${mode == 'edit' and current != null}" class="rounded-lg border border-cinema-border bg-cinema-sidebar p-4 text-sm">
                <strong class="text-white" th:text="${current.customerName}">Khách hàng</strong>
                <p class="text-cinema-muted" th:text="${current.customerEmail + ' - ' + current.customerPhone}">email</p>
            </div>
            <label class="block" th:if="${mode != 'edit'}">
                <span class="mb-1 block text-sm text-cinema-muted">Khách hàng</span>
                <select class="hc-input w-full" th:field="*{userId}">
                    <option value="">Chọn khách hàng</option>
                    <option th:each="customer : ${customers}" th:value="${customer.userId}" th:text="${customer.displayName}">Khách hàng</option>
                </select>
            </label>
            <label class="block">
                <span class="mb-1 block text-sm text-cinema-muted">Gói</span>
                <select class="hc-input w-full" th:field="*{planId}">
                    <option value="">Chọn gói</option>
                    <option th:each="plan : ${plans}" th:value="${plan.planId}" th:text="${plan.name}">Gold</option>
                </select>
            </label>
            <label class="block">
                <span class="mb-1 block text-sm text-cinema-muted">Trạng thái</span>
                <select class="hc-input w-full" th:field="*{status}">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </label>
            <div class="flex justify-end gap-3">
                <a class="hc-btn no-underline" th:href="@{/admin/memberships/users}">Hủy</a>
                <button class="hc-btn hc-btn-primary" type="submit"><i data-lucide="save"></i> Lưu</button>
            </div>
        </form>
    </div>
</main>
<script defer th:src="@{/js/ui/sidebar.js(v=1.0)}"></script>
</body>
</html>
