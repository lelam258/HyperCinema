<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết gói thành viên - HyperCinema')}"></head>
<body class="min-h-screen">
<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('memberships')}"></nav>
<main class="hc-page hc-admin-page">
    <header class="hc-admin-topbar">
        <nav class="hc-admin-crumb" aria-label="Breadcrumb">
            <a th:href="@{/admin/memberships/plans}">Thành viên</a>
            <span>/</span>
            <strong th:text="${plan.name}">Gói</strong>
        </nav>
    </header>
    <div class="hc-page-inner">
        <div th:replace="~{fragments/components :: flashes}"></div>
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white" th:text="${plan.name}">Gold</h1>
                <p class="mt-1 text-sm text-cinema-muted">Gói thành viên</p>
            </div>
            <div class="flex gap-2">
                <a class="hc-btn no-underline" th:href="@{|/admin/memberships/plans/${plan.planId}/edit|}"><i data-lucide="pencil"></i> Sửa</a>
                <a class="hc-btn no-underline" th:href="@{/admin/memberships/plans}">Danh sách</a>
            </div>
        </div>
        <section class="mt-6 grid gap-4 md:grid-cols-2">
            <div class="rounded-xl border border-cinema-border bg-cinema-panel p-5">
                <p class="text-sm text-cinema-muted">Cấp</p>
                <strong class="text-2xl text-white" th:text="${plan.level}">1</strong>
            </div>
            <div class="rounded-xl border border-cinema-border bg-cinema-panel p-5">
                <p class="text-sm text-cinema-muted">Giảm giá</p>
                <strong class="text-2xl text-white" th:text="${plan.discountPercent + '%'}">10%</strong>
            </div>
            <div class="rounded-xl border border-cinema-border bg-cinema-panel p-5">
                <p class="text-sm text-cinema-muted">Điểm yêu cầu</p>
                <strong class="text-2xl text-white" th:text="${#numbers.formatInteger(plan.price != null ? plan.price : 0, 0, 'POINT') + ' điểm'}">0 điểm</strong>
            </div>
            <div class="rounded-xl border border-cinema-border bg-cinema-panel p-5">
                <p class="text-sm text-cinema-muted">Trạng thái</p>
                <strong class="text-2xl text-white" th:text="${plan.status}">ACTIVE</strong>
            </div>
            <div class="rounded-xl border border-cinema-border bg-cinema-panel p-5">
                <p class="text-sm text-cinema-muted">Khách hàng liên kết</p>
                <strong class="text-2xl text-white" th:text="${plan.activeUserCount + ' khách hàng active'}">0 khách hàng active</strong>
                <p class="mt-1 text-xs text-cinema-muted" th:text="${plan.inUse ? 'Có lịch sử khách hàng sử dụng gói này' : 'Chưa có khách hàng sử dụng'}">Có lịch sử</p>
            </div>
        </section>
    </div>
</main>
<script defer th:src="@{/js/ui/sidebar.js(v=1.0)}"></script>
</body>
</html>
