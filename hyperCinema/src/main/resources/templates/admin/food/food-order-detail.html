<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn F&B - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('food')}"></nav>

<main class="hc-page">
    <div class="hc-page-inner max-w-5xl">
        <a th:href="@{/admin/food-orders}" class="mb-4 inline-flex text-sm text-cinema-muted no-underline hover:text-accent">← Quay lại đơn F&B</a>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <section class="hc-card mb-6 p-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <h1 class="hc-page-title" th:text="'Đơn #' + ${order.orderId}">Đơn #1</h1>
                    <p class="hc-page-subtitle" th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}">Ngày tạo</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <form th:if="${order.status == 'PENDING'}" th:action="@{|/admin/food-orders/${order.orderId}/confirm|}" method="post">
                        <button type="submit" class="hc-btn border-success bg-success/10 text-success hover:bg-success/20">Xác nhận đơn</button>
                    </form>
                    <form th:if="${order.status == 'PENDING' or order.status == 'CONFIRMED'}" th:action="@{|/admin/food-orders/${order.orderId}/cancel|}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn này?');">
                        <button type="submit" class="hc-btn border-danger bg-danger/10 text-danger hover:bg-danger/20">Hủy đơn</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="hc-card mb-6 p-6" aria-label="Thông tin đơn hàng">
            <h2 class="mb-4 text-lg font-semibold text-white">Thông tin đơn hàng</h2>
            <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <div><dt class="hc-label mb-1">Mã đặt vé</dt><dd class="text-white tabular-nums" th:text="${order.bookingId}">123</dd></div>
                <div>
                    <dt class="hc-label mb-1">Trạng thái</dt>
                    <dd>
                        <span th:switch="${order.status}">
                            <span th:case="'PENDING'" class="hc-badge border-warning/50 bg-warning/10 text-warning">Chờ xử lý</span>
                            <span th:case="'CONFIRMED'" class="hc-badge border-success/50 bg-success/10 text-success">Đã xác nhận</span>
                            <span th:case="'CANCELLED'" class="hc-badge border-danger/50 bg-danger/10 text-danger">Đã hủy</span>
                            <span th:case="*" class="hc-badge border-cinema-border text-cinema-muted" th:text="${order.status}">?</span>
                        </span>
                    </dd>
                </div>
                <div><dt class="hc-label mb-1">Số mặt hàng</dt><dd class="text-white tabular-nums" th:text="${order.items != null ? #lists.size(order.items) : 0}">0</dd></div>
                <div><dt class="hc-label mb-1">Tổng tiền</dt><dd class="text-xl font-bold text-accent tabular-nums" th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT') + ' đ'}">100.000 đ</dd></div>
            </dl>
        </section>

        <section class="hc-card overflow-hidden" aria-label="Chi tiết mặt hàng">
            <div class="border-b border-cinema-border p-5">
                <h2 class="text-lg font-semibold text-white">Chi tiết mặt hàng</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="hc-table">
                    <thead>
                    <tr>
                        <th>Mặt hàng</th>
                        <th class="text-right">Đơn giá</th>
                        <th class="text-center">Số lượng</th>
                        <th class="text-right">Thành tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.itemName}" class="font-semibold text-white">Bắp rang</td>
                        <td class="text-right tabular-nums" th:text="${#numbers.formatInteger(item.unitPrice, 0, 'POINT') + ' đ'}">50.000 đ</td>
                        <td class="text-center tabular-nums" th:text="${item.quantity}">2</td>
                        <td class="text-right font-semibold text-white tabular-nums" th:text="${#numbers.formatInteger(item.subtotal, 0, 'POINT') + ' đ'}">100.000 đ</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="border-t border-cinema-border">
                        <td colspan="3" class="px-5 py-4 text-right font-medium text-cinema-muted">Tổng cộng</td>
                        <td class="px-5 py-4 text-right text-lg font-bold text-accent tabular-nums" th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT') + ' đ'}">100.000 đ</td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
