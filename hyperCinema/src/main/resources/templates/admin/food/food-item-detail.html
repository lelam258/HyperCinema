<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết mặt hàng - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('food')}"></nav>

<main class="hc-page">
    <div class="hc-page-inner max-w-5xl">
        <a th:href="@{/admin/food-items}" class="mb-4 inline-flex text-sm text-cinema-muted no-underline hover:text-accent">← Quay lại F&B</a>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <section class="hc-card mb-6 p-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <h1 class="hc-page-title" th:text="${item.name}">Tên mặt hàng</h1>
                    <p class="hc-page-subtitle" th:text="${item.categoryName}">Danh mục</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <a th:href="@{|/admin/food-items/${item.itemId}/edit|}" class="hc-btn hc-btn-primary no-underline">Chỉnh sửa</a>
                    <form th:action="@{|/admin/food-items/${item.itemId}|}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa mặt hàng này?');" sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" name="_method" value="delete">
                        <button type="submit" class="hc-btn text-danger hover:text-red-300">Xóa</button>
                    </form>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_20rem]">
            <section class="hc-card p-6" aria-label="Thông tin mặt hàng">
                <h2 class="mb-4 text-lg font-semibold text-white">Thông tin mặt hàng</h2>
                <dl class="space-y-4">
                    <div><dt class="hc-label mb-1">Danh mục</dt><dd class="text-white" th:text="${item.categoryName}">Đồ ăn</dd></div>
                    <div><dt class="hc-label mb-1">Giá bán</dt><dd class="text-xl font-bold text-accent tabular-nums" th:text="${#numbers.formatInteger(item.price, 0, 'POINT') + ' đ'}">50.000 đ</dd></div>
                    <div><dt class="hc-label mb-1">Mô tả</dt><dd class="text-cinema-muted" th:text="${item.description != null and !#strings.isEmpty(item.description)} ? ${item.description} : 'Chưa có mô tả'">Mô tả</dd></div>
                    <div th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}">
                        <dt class="hc-label mb-2">Hình ảnh</dt>
                        <dd><img th:src="${item.imageUrl}" alt="Hình ảnh mặt hàng" class="max-h-72 rounded-xl border border-cinema-border object-cover"></dd>
                    </div>
                </dl>
            </section>

            <aside class="space-y-6">
                <section class="hc-card p-6" aria-label="Trạng thái mặt hàng">
                    <h2 class="mb-4 text-lg font-semibold text-white">Trạng thái</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between gap-4">
                            <span class="hc-label mb-0">Bày bán</span>
                            <span th:if="${item.isAvailable}" class="hc-badge border-success/50 bg-success/10 text-success">Đang bán</span>
                            <span th:unless="${item.isAvailable}" class="hc-badge border-cinema-border text-cinema-muted">Ngừng bán</span>
                        </div>
                        <div class="flex items-center justify-between gap-4">
                            <span class="hc-label mb-0">Tồn kho</span>
                            <span th:if="${item.stock == 0}" class="hc-badge border-danger/50 bg-danger/10 text-danger">Hết hàng</span>
                            <span th:unless="${item.stock == 0}" class="text-xl font-semibold text-white tabular-nums" th:text="${item.stock}">100</span>
                        </div>
                    </div>
                </section>

                <section class="hc-card p-6" aria-label="Điều chỉnh tồn kho">
                    <h2 class="mb-4 text-lg font-semibold text-white">Điều chỉnh tồn kho</h2>
                    <form th:action="@{|/admin/food-items/${item.itemId}/stock|}" method="post" class="space-y-4">
                        <div>
                            <label for="newStock" class="hc-label">Số lượng mới</label>
                            <input class="hc-input" type="number" id="newStock" name="newStock" min="0" required th:value="${item.stock}">
                        </div>
                        <button type="submit" class="hc-btn hc-btn-primary w-full">Cập nhật tồn kho</button>
                    </form>
                </section>
            </aside>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
