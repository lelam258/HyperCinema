<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? 'Chỉnh sửa phòng chiếu' : 'Tạo phòng chiếu')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="${hallContext.admin} ? ~{fragments/layout :: adminSidebar('halls')} : (${hallContext.sidebar == 'manager'} ? ~{fragments/layout :: managerSidebar('halls')} : ~{fragments/layout :: branchSidebar('halls')})"></nav>

<main class="md:ml-64 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight" th:text="${mode == 'edit'} ? 'Chỉnh sửa phòng chiếu' : 'Tạo phòng chiếu'">Tạo phòng chiếu</h1>
        </div>

        <div class="glass-card p-6 md:p-8">
            <form th:object="${hall}" th:action="${mode == 'edit'} ? @{|/admin/halls/${hallId}|} : @{/admin/halls}" method="post" novalidate class="space-y-5">
                <div th:if="${#fields.hasGlobalErrors()}" class="flex flex-col gap-1 px-4 py-3 rounded-xl bg-danger/10 border border-danger/25 text-danger text-sm" role="alert">
                    <strong>Không thể lưu phòng chiếu:</strong>
                    <ul class="list-disc pl-5 space-y-0.5"><li th:each="err : ${#fields.globalErrors()}" th:text="${err}">global error</li></ul>
                </div>

                <div>
                    <label for="name" class="block text-sm font-medium text-slate-400 mb-2">Tên phòng chiếu</label>
                    <input type="text" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' border-danger!' : ''" maxlength="50" autocomplete="off" required class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="block text-xs text-danger mt-1"></span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="hallType" class="block text-sm font-medium text-slate-400 mb-2">Loại phòng</label>
                        <select id="hallType" th:field="*{hallType}" th:classappend="${#fields.hasErrors('hallType')} ? ' border-danger!' : ''" required class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                            <option value="">Chọn loại phòng</option>
                            <option value="2D">2D</option>
                            <option value="3D">3D</option>
                            <option value="IMAX">IMAX</option>
                            <option value="VIP">VIP</option>
                        </select>
                        <span th:if="${#fields.hasErrors('hallType')}" th:errors="*{hallType}" class="block text-xs text-danger mt-1"></span>
                    </div>
                    <div>
                        <label for="capacity" class="block text-sm font-medium text-slate-400 mb-2">Sức chứa</label>
                        <input type="number" id="capacity" th:field="*{capacity}" th:classappend="${#fields.hasErrors('capacity')} ? ' border-danger!' : ''" min="1" required class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                        <span th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="block text-xs text-danger mt-1"></span>
                    </div>
                </div>

                <div>
                    <label for="status" class="block text-sm font-medium text-slate-400 mb-2">Trạng thái</label>
                    <select id="status" th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? ' border-danger!' : ''" required class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="Active">Active</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                    <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="block text-xs text-danger mt-1"></span>
                </div>

                <div th:if="${hallContext.admin}">
                    <label for="branchId" class="block text-sm font-medium text-slate-400 mb-2">Chi nhánh</label>
                    <select id="branchId" th:field="*{branchId}" class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="">Chọn chi nhánh</option>
                        <option th:each="branch : ${hallContext.branchOptions}" th:value="${branch.branchId}" th:text="|${branch.name} - ${branch.city}|">Branch</option>
                    </select>
                </div>

                <div th:if="${!hallContext.admin}" class="px-4 py-3 rounded-xl bg-white/[0.04] border border-white/10">
                    <span class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1">Chi nhánh</span>
                    <span class="text-white" th:text="${hallContext.lockedBranch != null ? hallContext.lockedBranch.name : 'Chưa được gán chi nhánh'}">Branch</span>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/[0.08]">
                    <a th:href="${mode == 'edit'} ? @{|/admin/halls/${hallId}|} : @{/admin/halls}" class="px-5 py-2.5 text-sm font-medium text-slate-300 bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline cursor-pointer">Hủy</a>
                    <button type="submit" th:text="${mode == 'edit'} ? 'Lưu thay đổi' : 'Tạo mới'" class="px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer">Tạo mới</button>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
