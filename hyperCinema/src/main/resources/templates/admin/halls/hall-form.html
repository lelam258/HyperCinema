<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? 'Chỉnh sửa phòng chiếu' : 'Tạo phòng chiếu')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="${hallContext.admin} ? ~{fragments/layout :: adminSidebar('halls')} : (${hallContext.sidebar == 'manager'} ? ~{fragments/layout :: managerSidebar('halls')} : ~{fragments/layout :: branchSidebar('halls')})"></nav>

<main class="hc-page">
    <div class="hc-page-inner max-w-3xl">
        <a th:href="${mode == 'edit'} ? @{|/admin/halls/${hallId}|} : @{/admin/halls}" class="mb-4 inline-flex text-sm text-cinema-muted no-underline hover:text-accent">&larr; Quay lại</a>

        <div class="mb-6">
            <h1 class="hc-page-title" th:text="${mode == 'edit'} ? 'Chỉnh sửa phòng chiếu' : 'Tạo phòng chiếu'">Tạo phòng chiếu</h1>
            <p class="hc-page-subtitle">Thiết lập thông tin phòng, loại phòng và chi nhánh phụ trách.</p>
        </div>

        <section class="hc-card p-6 md:p-8">
            <form th:object="${hall}" th:action="${mode == 'edit'} ? @{|/admin/halls/${hallId}|} : @{/admin/halls}" method="post" novalidate class="space-y-5">
                <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
                    <strong>Không thể lưu phòng chiếu:</strong>
                    <ul class="mt-2 list-disc space-y-1 pl-5">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">global error</li>
                    </ul>
                </div>

                <div>
                    <label for="name" class="hc-label">Tên phòng chiếu</label>
                    <input class="hc-input" type="text" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' border-danger!' : ''" maxlength="50" autocomplete="off" required>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 block text-xs text-danger"></span>
                </div>

                <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                    <div>
                        <label for="hallType" class="hc-label">Loại phòng</label>
                        <select class="hc-input" id="hallType" th:field="*{hallType}" th:classappend="${#fields.hasErrors('hallType')} ? ' border-danger!' : ''" required>
                            <option value="">Chọn loại phòng</option>
                            <option value="2D">2D</option>
                            <option value="3D">3D</option>
                            <option value="IMAX">IMAX</option>
                            <option value="VIP">VIP</option>
                        </select>
                        <span th:if="${#fields.hasErrors('hallType')}" th:errors="*{hallType}" class="mt-1 block text-xs text-danger"></span>
                    </div>
                    <div th:if="${mode == 'edit'}">
                        <label for="capacity" class="hc-label">Sức chứa</label>
                        <input class="hc-input" type="number" id="capacity" th:field="*{capacity}" th:classappend="${#fields.hasErrors('capacity')} ? ' border-danger!' : ''" min="1" required>
                        <span th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="mt-1 block text-xs text-danger"></span>
                    </div>
                </div>

                <div th:if="${mode == 'create'}" class="grid grid-cols-1 gap-4 md:grid-cols-3" data-hall-layout-form>
                    <div>
                        <label for="rowCount" class="hc-label">Số hàng ghế</label>
                        <input class="hc-input" type="number" id="rowCount" th:field="*{rowCount}" th:classappend="${#fields.hasErrors('rowCount')} ? ' border-danger!' : ''" min="1" max="26" required data-hall-row-count>
                        <span th:if="${#fields.hasErrors('rowCount')}" th:errors="*{rowCount}" class="mt-1 block text-xs text-danger"></span>
                    </div>
                    <div>
                        <label for="columnCount" class="hc-label">Số cột ghế</label>
                        <input class="hc-input" type="number" id="columnCount" th:field="*{columnCount}" th:classappend="${#fields.hasErrors('columnCount')} ? ' border-danger!' : ''" min="1" max="50" required data-hall-column-count>
                        <span th:if="${#fields.hasErrors('columnCount')}" th:errors="*{columnCount}" class="mt-1 block text-xs text-danger"></span>
                    </div>
                    <div>
                        <label for="capacity" class="hc-label">Sức chứa tự động</label>
                        <input class="hc-input" type="number" id="capacity" th:field="*{capacity}" min="1" readonly data-hall-capacity>
                        <span class="mt-1 block text-xs text-cinema-muted">Hệ thống sẽ tạo ghế từ A1 theo số hàng và số cột.</span>
                    </div>
                </div>

                <div>
                    <label for="status" class="hc-label">Trạng thái</label>
                    <select class="hc-input" id="status" th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? ' border-danger!' : ''" required>
                        <option value="Active">Hoạt động</option>
                        <option value="Maintenance">Bảo trì</option>
                        <option value="Inactive">Ngừng hoạt động</option>
                    </select>
                    <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="mt-1 block text-xs text-danger"></span>
                </div>

                <div th:if="${hallContext.admin}">
                    <label for="branchId" class="hc-label">Chi nhánh</label>
                    <select class="hc-input" id="branchId" th:field="*{branchId}">
                        <option value="">Chọn chi nhánh</option>
                        <option th:each="branch : ${hallContext.branchOptions}" th:value="${branch.branchId}" th:text="|${branch.name} - ${branch.city}|">Branch</option>
                    </select>
                </div>

                <div th:if="${!hallContext.admin}" class="hc-subcard p-4">
                    <span class="hc-label mb-1">Chi nhánh</span>
                    <span class="text-white" th:text="${hallContext.lockedBranch != null ? hallContext.lockedBranch.name : 'Chưa được gán chi nhánh'}">Branch</span>
                </div>

                <div class="flex justify-end gap-3 border-t border-cinema-border pt-5">
                    <a th:href="${mode == 'edit'} ? @{|/admin/halls/${hallId}|} : @{/admin/halls}" class="hc-btn no-underline">Hủy</a>
                    <button type="submit" th:text="${mode == 'edit'} ? 'Lưu thay đổi' : 'Tạo mới'" class="hc-btn hc-btn-primary">Tạo mới</button>
                </div>
            </form>
        </section>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

<script defer th:src="@{/js/features/hall-form.js(v=1.0)}"></script>
</body>
</html>
