<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý phòng chiếu - HyperCinema')}">
    <title>Quản lý phòng chiếu - HyperCinema</title>
</head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="${hallContext.admin} ? ~{fragments/layout :: adminSidebar('halls')} : (${hallContext.sidebar == 'manager'} ? ~{fragments/layout :: managerSidebar('halls')} : ~{fragments/layout :: branchSidebar('halls')})"></nav>

<main class="md:ml-64 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Quản lý phòng chiếu</h1>
                <p th:if="${!hallContext.admin and hallContext.lockedBranch != null}"
                   class="text-sm text-slate-400 mt-1"
                   th:text="|Chi nhánh: ${hallContext.lockedBranch.name} - ${hallContext.lockedBranch.city}|">Chi nhánh</p>
            </div>
            <a th:href="@{/admin/halls/new}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary to-amber-500 text-white font-semibold rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 hover:-translate-y-0.5 cursor-pointer no-underline text-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Tạo mới
            </a>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <div class="glass-card p-5 mb-6">
            <form th:action="@{/admin/halls}" method="get" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                <div>
                    <label for="keyword" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Từ khóa</label>
                    <input type="text" id="keyword" name="keyword" placeholder="Tên phòng hoặc chi nhánh" th:value="${criteria != null ? criteria.keyword : ''}" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div th:if="${hallContext.admin}">
                    <label for="branchId" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Chi nhánh</label>
                    <select id="branchId" name="branchId" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="" th:selected="${criteria == null or criteria.branchId == null}">Tất cả</option>
                        <option th:each="branch : ${hallContext.branchOptions}" th:value="${branch.branchId}" th:text="|${branch.name} - ${branch.city}|" th:selected="${criteria != null and criteria.branchId == branch.branchId}">Branch</option>
                    </select>
                </div>
                <div>
                    <label for="city" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Thành phố</label>
                    <input type="text" id="city" name="city" placeholder="Ví dụ: Hà Nội" th:value="${criteria != null ? criteria.city : ''}" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div>
                    <label for="hallType" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Loại phòng</label>
                    <select id="hallType" name="hallType" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="" th:selected="${criteria == null or criteria.hallType == null or #strings.isEmpty(criteria.hallType)}">Tất cả</option>
                        <option value="2D" th:selected="${criteria != null and criteria.hallType == '2D'}">2D</option>
                        <option value="3D" th:selected="${criteria != null and criteria.hallType == '3D'}">3D</option>
                        <option value="IMAX" th:selected="${criteria != null and criteria.hallType == 'IMAX'}">IMAX</option>
                    </select>
                </div>
                <div>
                    <label for="status" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Trạng thái</label>
                    <select id="status" name="status" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="" th:selected="${criteria == null or criteria.status == null or #strings.isEmpty(criteria.status)}">Tất cả</option>
                        <option value="Active" th:selected="${criteria != null and criteria.status == 'Active'}">Active</option>
                        <option value="Maintenance" th:selected="${criteria != null and criteria.status == 'Maintenance'}">Maintenance</option>
                        <option value="Inactive" th:selected="${criteria != null and criteria.status == 'Inactive'}">Inactive</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer">Tìm kiếm</button>
                    <a th:href="@{/admin/halls}" class="px-4 py-2.5 text-sm font-medium text-slate-300 bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline cursor-pointer">Xóa</a>
                </div>
            </form>
        </div>

        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-white/[0.08]">
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Phòng</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Chi nhánh</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Loại phòng</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Trạng thái</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Thành phố</th>
                        <th class="px-4 py-3 text-right text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Sức chứa</th>
                        <th class="px-4 py-3 text-right text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Ghế</th>
                        <th class="px-4 py-3 text-right text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Suất chiếu</th>
                        <th class="px-4 py-3 text-center text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-white/[0.06]">
                    <tr th:if="${page == null or #lists.isEmpty(page.content)}"><td colspan="9" class="px-4 py-14 text-center text-slate-500">Không có phòng chiếu nào phù hợp.</td></tr>
                    <tr th:each="item : ${page != null ? page.content : {}}" th:if="${page != null and not #lists.isEmpty(page.content)}" class="hover:bg-white/[0.04] transition-colors">
                        <td class="px-4 py-3"><a th:href="@{'/admin/halls/{id}'(id=${item.hallId})}" th:text="${item.name}" class="text-white font-semibold no-underline hover:text-primary transition-colors">Hall</a></td>
                        <td class="px-4 py-3 text-slate-300" th:text="${item.branchName}">Branch</td>
                        <td class="px-4 py-3 text-slate-400" th:text="${item.hallType}">2D</td>
                        <td class="px-4 py-3"><span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border border-white/10 bg-white/[0.06] text-slate-200" th:text="${item.status}">Active</span></td>
                        <td class="px-4 py-3 text-slate-400" th:text="${item.city}">City</td>
                        <td class="px-4 py-3 text-right text-slate-400 tabular-nums" th:text="${item.capacity}">0</td>
                        <td class="px-4 py-3 text-right text-slate-400 tabular-nums" th:text="${item.seatCount}">0</td>
                        <td class="px-4 py-3 text-right text-slate-400 tabular-nums" th:text="${item.showtimeCount}">0</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center justify-center gap-1">
                                <a th:href="@{'/admin/halls/{id}'(id=${item.hallId})}" title="Xem chi tiết" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-sky-400 hover:bg-sky-400/10 transition-all duration-200 no-underline cursor-pointer">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </a>
                                <a th:href="@{'/admin/halls/{id}/edit'(id=${item.hallId})}" title="Chỉnh sửa" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-primary hover:bg-primary/10 transition-all duration-200 no-underline cursor-pointer">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </a>
                                <form th:if="${item.canDelete}" th:action="@{'/admin/halls/{id}'(id=${item.hallId})}" method="post" class="inline" onsubmit="return confirm('Xóa phòng chiếu này?');">
                                    <input type="hidden" name="_method" value="delete">
                                    <button type="submit" title="Xóa" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-danger hover:bg-danger/10 transition-all duration-200 cursor-pointer border-0 bg-transparent">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Section -->
            <div th:if="${page.totalPages > 1}" class="flex items-center justify-between gap-4 px-5 py-4 border-t border-white/[0.08] bg-white/[0.02] flex-wrap">
                <div class="text-sm text-slate-400">Trang <strong class="text-slate-200" th:text="${page.number + 1}">1</strong> / <strong class="text-slate-200" th:text="${page.totalPages}">1</strong> - tổng <strong class="text-slate-200" th:text="${page.totalElements}">0</strong> phòng chiếu</div>
                <div class="inline-flex items-center gap-1 flex-wrap">
                    <a th:if="${not page.first}" th:href="@{/admin/halls(keyword=${criteria.keyword}, branchId=${criteria.branchId}, city=${criteria.city}, hallType=${criteria.hallType}, status=${criteria.status}, sort=${criteria.sort}, direction=${criteria.direction}, page=${page.number - 1})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline">‹ Trước</a>
                    <span th:if="${page.first}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">‹ Trước</span>
                    <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                        <span th:if="${i == page.number}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 rounded-lg text-sm font-bold text-white bg-gradient-to-r from-primary to-amber-500 border border-white/20 shadow-lg shadow-primary/20" th:text="${i + 1}">1</span>
                        <a th:if="${i != page.number}" th:href="@{/admin/halls(keyword=${criteria.keyword}, branchId=${criteria.branchId}, city=${criteria.city}, hallType=${criteria.hallType}, status=${criteria.status}, sort=${criteria.sort}, direction=${criteria.direction}, page=${i})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline" th:text="${i + 1}">1</a>
                    </th:block>
                    <a th:if="${not page.last}" th:href="@{/admin/halls(keyword=${criteria.keyword}, branchId=${criteria.branchId}, city=${criteria.city}, hallType=${criteria.hallType}, status=${criteria.status}, sort=${criteria.sort}, direction=${criteria.direction}, page=${page.number + 1})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline">Sau ›</a>
                    <span th:if="${page.last}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">Sau ›</span>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
