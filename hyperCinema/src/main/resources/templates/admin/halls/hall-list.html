<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý phòng chiếu - HyperCinema')}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="${hallContext.admin} ? ~{fragments/layout :: adminSidebar('halls')} : (${hallContext.sidebar == 'manager'} ? ~{fragments/layout :: managerSidebar('halls')} : ~{fragments/layout :: branchSidebar('halls')})"></nav>

<main class="hc-page">
    <div class="hc-page-inner">
        <div class="mb-6 flex flex-wrap items-start justify-between gap-4">
            <div>
                <h1 class="hc-page-title">Quản lý phòng chiếu</h1>
                <p class="hc-page-subtitle" th:if="${!hallContext.admin and hallContext.lockedBranch != null}"
                   th:text="|Chi nhánh: ${hallContext.lockedBranch.name} - ${hallContext.lockedBranch.city}|">Chi nhánh</p>
            </div>
            <a th:href="@{/admin/halls/new}" class="hc-btn hc-btn-primary no-underline">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Tạo mới
            </a>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <section class="hc-card mb-6 p-5" aria-label="Bộ lọc phòng chiếu">
            <form th:action="@{/admin/halls}" method="get" class="grid grid-cols-1 items-end gap-4 sm:grid-cols-2 lg:grid-cols-6">
                <div>
                    <label for="keyword" class="hc-label">Từ khóa</label>
                    <input class="hc-input" type="text" id="keyword" name="keyword" placeholder="Tên phòng hoặc chi nhánh" th:value="${criteria != null ? criteria.keyword : ''}">
                </div>
                <div th:if="${hallContext.admin}">
                    <label for="branchId" class="hc-label">Chi nhánh</label>
                    <select class="hc-input" id="branchId" name="branchId">
                        <option value="" th:selected="${criteria == null or criteria.branchId == null}">Tất cả</option>
                        <option th:each="branch : ${hallContext.branchOptions}" th:value="${branch.branchId}" th:text="|${branch.name} - ${branch.city}|" th:selected="${criteria != null and criteria.branchId == branch.branchId}">Branch</option>
                    </select>
                </div>
                <div>
                    <label for="city" class="hc-label">Thành phố</label>
                    <input class="hc-input" type="text" id="city" name="city" placeholder="Ví dụ: Hà Nội" th:value="${criteria != null ? criteria.city : ''}">
                </div>
                <div>
                    <label for="hallType" class="hc-label">Loại phòng</label>
                    <select class="hc-input" id="hallType" name="hallType">
                        <option value="" th:selected="${criteria == null or criteria.hallType == null or #strings.isEmpty(criteria.hallType)}">Tất cả</option>
                        <option value="2D" th:selected="${criteria != null and criteria.hallType == '2D'}">2D</option>
                        <option value="3D" th:selected="${criteria != null and criteria.hallType == '3D'}">3D</option>
                        <option value="IMAX" th:selected="${criteria != null and criteria.hallType == 'IMAX'}">IMAX</option>
                    </select>
                </div>
                <div>
                    <label for="status" class="hc-label">Trạng thái</label>
                    <select class="hc-input" id="status" name="status">
                        <option value="" th:selected="${criteria == null or criteria.status == null or #strings.isEmpty(criteria.status)}">Tất cả</option>
                        <option value="Active" th:selected="${criteria != null and criteria.status == 'Active'}">Hoạt động</option>
                        <option value="Maintenance" th:selected="${criteria != null and criteria.status == 'Maintenance'}">Bảo trì</option>
                        <option value="Inactive" th:selected="${criteria != null and criteria.status == 'Inactive'}">Ngừng hoạt động</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="hc-btn hc-btn-primary flex-1">Tìm kiếm</button>
                    <a th:href="@{/admin/halls}" class="hc-btn no-underline">Xóa</a>
                </div>
            </form>
        </section>

        <section class="hc-card overflow-hidden" aria-label="Danh sách phòng chiếu">
            <div class="overflow-x-auto">
                <table class="hc-table">
                    <thead>
                    <tr>
                        <th>Phòng</th>
                        <th>Chi nhánh</th>
                        <th>Loại</th>
                        <th class="text-right">Khoảng giá</th>
                        <th>Trạng thái</th>
                        <th>Thành phố</th>
                        <th class="text-right">Sức chứa</th>
                        <th class="text-right">Ghế</th>
                        <th class="text-right">Suất chiếu</th>
                        <th class="text-right">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                        <td colspan="10" class="py-12 text-center text-cinema-muted">Không có phòng chiếu nào phù hợp.</td>
                    </tr>
                    <tr th:each="item : ${page != null ? page.content : {}}" th:if="${page != null and not #lists.isEmpty(page.content)}">
                        <td><a th:href="@{|/admin/halls/${item.hallId}|}" th:text="${item.name}" class="font-semibold text-white no-underline hover:text-accent">Hall</a></td>
                        <td th:text="${item.branchName}">Branch</td>
                        <td th:text="${item.hallType}">2D</td>
                        <td class="text-right tabular-nums">
                            <span th:text="${item.priceRange} + ' đ'">80.000 - 160.000 đ</span>
                            <span th:if="${item.weekendPricingActive}" class="hc-badge ml-2" th:text="${item.weekendPricingLabel}">Weekend</span>
                        </td>
                        <td><span th:replace="~{fragments/components :: statusBadge(${item.status})}"></span></td>
                        <td th:text="${item.city}">City</td>
                        <td class="text-right tabular-nums" th:text="${item.capacity}">0</td>
                        <td class="text-right tabular-nums" th:text="${item.seatCount}">0</td>
                        <td class="text-right tabular-nums" th:text="${item.showtimeCount}">0</td>
                        <td>
                            <div class="flex justify-end gap-2">
                                <a class="hc-btn px-3 py-1.5 no-underline" th:href="@{|/admin/halls/${item.hallId}|}">Xem</a>
                                <a class="hc-btn px-3 py-1.5 no-underline" th:href="@{|/admin/halls/${item.hallId}/edit|}">Sửa</a>
                                <form th:if="${item.canDelete}" th:action="@{|/admin/halls/${item.hallId}|}" method="post" onsubmit="return confirm('Ngừng hoạt động phòng chiếu này?');">
                                    <input type="hidden" name="_method" value="delete">
                                    <button type="submit" class="hc-btn px-3 py-1.5 text-danger hover:text-red-300">Ngừng</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
