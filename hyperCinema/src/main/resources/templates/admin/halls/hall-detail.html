<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|Chi tiết phòng chiếu - ${hall.name} - HyperCinema|)}"></head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="${hallContext.admin} ? ~{fragments/layout :: adminSidebar('halls')} : (${hallContext.sidebar == 'manager'} ? ~{fragments/layout :: managerSidebar('halls')} : ~{fragments/layout :: branchSidebar('halls')})"></nav>

<main class="hc-page">
    <div class="hc-page-inner max-w-5xl">
        <nav class="mb-6 flex items-center gap-2 text-sm text-cinema-muted" aria-label="Breadcrumb">
            <a th:href="@{/admin/halls}" class="text-cinema-muted no-underline hover:text-accent">Quản lý phòng chiếu</a>
            <span>/</span>
            <span class="text-white" th:text="${hall.name}">Hall</span>
        </nav>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <section class="hc-card mb-6 p-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div>
                    <h1 class="hc-page-title" th:text="${hall.name}">Hall</h1>
                    <p class="hc-page-subtitle" th:text="|${hall.branchName} - ${hall.city}|">Branch</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <a th:href="@{|/admin/halls/${hall.hallId}/seats|}" class="hc-btn hc-btn-accent no-underline">Sơ đồ ghế</a>
                    <a th:href="@{|/admin/halls/${hall.hallId}/edit|}" class="hc-btn hc-btn-primary no-underline">Chỉnh sửa</a>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <section class="hc-card p-6" aria-label="Thông tin phòng">
                <h2 class="mb-4 text-lg font-semibold text-white">Thông tin phòng</h2>
                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div><dt class="hc-label mb-1">Mã phòng</dt><dd class="text-white tabular-nums" th:text="${hall.hallId}">1</dd></div>
                    <div><dt class="hc-label mb-1">Tên phòng</dt><dd class="text-white" th:text="${hall.name}">Hall</dd></div>
                    <div><dt class="hc-label mb-1">Loại phòng</dt><dd class="text-white" th:text="${hall.hallType}">2D</dd></div>
                    <div><dt class="hc-label mb-1">Giá fallback</dt><dd class="text-white tabular-nums" th:text="${#numbers.formatDecimal(hall.ticketPrice, 0, 'POINT', 0, 'POINT')} + ' đ'">80.000 đ</dd></div>
                    <div><dt class="hc-label mb-1">Trạng thái</dt><dd><span th:replace="~{fragments/components :: statusBadge(${hall.status})}"></span></dd></div>
                    <div><dt class="hc-label mb-1">Sức chứa</dt><dd class="text-white tabular-nums" th:text="${hall.capacity}">0</dd></div>
                    <div><dt class="hc-label mb-1">Số ghế</dt><dd class="text-white tabular-nums" th:text="${hall.seatCount}">0</dd></div>
                    <div><dt class="hc-label mb-1">Số suất chiếu</dt><dd class="text-white tabular-nums" th:text="${hall.showtimeCount}">0</dd></div>
                </dl>
            </section>

            <section class="hc-card p-6" aria-label="Bảng giá ghế">
                <h2 class="mb-4 text-lg font-semibold text-white">Bảng giá theo loại ghế</h2>
                <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div th:each="price : ${hall.seatTypePrices}">
                        <dt class="hc-label mb-1" th:text="${price.label}">Thường</dt>
                        <dd class="text-white tabular-nums" th:text="${#numbers.formatDecimal(price.price, 0, 'POINT', 0, 'POINT')} + ' đ'">80.000 đ</dd>
                    </div>
                </dl>
            </section>

            <section class="hc-card p-6" aria-label="Thông tin chi nhánh">
                <h2 class="mb-4 text-lg font-semibold text-white">Chi nhánh</h2>
                <dl class="space-y-4">
                    <div><dt class="hc-label mb-1">Tên chi nhánh</dt><dd class="text-white" th:text="${hall.branchName}">Branch</dd></div>
                    <div><dt class="hc-label mb-1">Thành phố</dt><dd class="text-white" th:text="${hall.city}">City</dd></div>
                    <div><dt class="hc-label mb-1">Địa chỉ</dt><dd class="text-white" th:text="${hall.address}">Address</dd></div>
                </dl>
            </section>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
