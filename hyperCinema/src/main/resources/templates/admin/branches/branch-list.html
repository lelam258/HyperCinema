<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Chi nhánh - HyperCinema')}">
    <title>Quản lý Chi nhánh - HyperCinema</title>
</head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('branches')}"></nav>

<main class="md:ml-64 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-8">

        <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
            <h1 class="text-3xl font-bold text-white tracking-tight">Quản lý Chi nhánh</h1>
            <a th:href="@{/admin/branches/new}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary to-amber-500 text-white font-semibold rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 hover:-translate-y-0.5 cursor-pointer no-underline text-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Tạo mới
            </a>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <div class="glass-card p-5 mb-6">
            <form th:action="@{/admin/branches}" method="get" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <div>
                    <label for="keyword" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Từ khoá</label>
                    <input type="text" id="keyword" name="keyword" placeholder="Tên hoặc địa chỉ" th:value="${criteria != null ? criteria.keyword : ''}" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div>
                    <label for="city" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Thành phố</label>
                    <input type="text" id="city" name="city" placeholder="Ví dụ: Hà Nội" th:value="${criteria != null ? criteria.city : ''}" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div>
                    <label for="status" class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wide">Trạng thái</label>
                    <select id="status" name="status" class="w-full px-3.5 py-2.5 bg-white/[0.06] border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="" th:selected="${criteria == null or criteria.status == null or #strings.isEmpty(criteria.status)}">Tất cả</option>
                        <option value="Active" th:selected="${criteria != null and criteria.status == 'Active'}">Active</option>
                        <option value="Inactive" th:selected="${criteria != null and criteria.status == 'Inactive'}">Inactive</option>
                        <option value="Maintenance" th:selected="${criteria != null and criteria.status == 'Maintenance'}">Maintenance</option>
                    </select>
                </div>
                <div><button type="submit" class="w-full px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer">Tìm kiếm</button></div>
            </form>
        </div>

        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-white/[0.08]">
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">
                            <a class="no-underline transition-colors cursor-pointer" th:classappend="${criteria != null and criteria.sort == 'name'} ? ' text-primary' : ' text-slate-400 hover:text-slate-200'" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort='name',direction=${criteria != null and criteria.sort == 'name' and criteria.direction == 'ASC' ? 'DESC' : 'ASC'})}">
                                Tên chi nhánh <span th:if="${criteria != null and criteria.sort == 'name'}" th:text="${criteria.direction == 'ASC' ? '▲' : '▼'}">▲</span>
                            </a>
                        </th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">
                            <a class="no-underline transition-colors cursor-pointer" th:classappend="${criteria != null and criteria.sort == 'city'} ? ' text-primary' : ' text-slate-400 hover:text-slate-200'" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort='city',direction=${criteria != null and criteria.sort == 'city' and criteria.direction == 'ASC' ? 'DESC' : 'ASC'})}">
                                Thành phố <span th:if="${criteria != null and criteria.sort == 'city'}" th:text="${criteria.direction == 'ASC' ? '▲' : '▼'}">▲</span>
                            </a>
                        </th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Địa chỉ</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Số điện thoại</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">
                            <a class="no-underline transition-colors cursor-pointer" th:classappend="${criteria != null and criteria.sort == 'status'} ? ' text-primary' : ' text-slate-400 hover:text-slate-200'" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort='status',direction=${criteria != null and criteria.sort == 'status' and criteria.direction == 'ASC' ? 'DESC' : 'ASC'})}">
                                Trạng thái <span th:if="${criteria != null and criteria.sort == 'status'}" th:text="${criteria.direction == 'ASC' ? '▲' : '▼'}">▲</span>
                            </a>
                        </th>
                        <th class="px-4 py-3 text-right text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">Số phòng chiếu</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-400 bg-white/[0.02]">
                            <a class="no-underline transition-colors cursor-pointer" th:classappend="${criteria != null and criteria.sort == 'createdAt'} ? ' text-primary' : ' text-slate-400 hover:text-slate-200'" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort='createdAt',direction=${criteria != null and criteria.sort == 'createdAt' and criteria.direction == 'ASC' ? 'DESC' : 'ASC'})}">
                                Ngày tạo <span th:if="${criteria != null and criteria.sort == 'createdAt'}" th:text="${criteria.direction == 'ASC' ? '▲' : '▼'}">▲</span>
                            </a>
                        </th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-white/[0.06]">
                    <tr th:if="${page == null or #lists.isEmpty(page.content)}"><td colspan="8" class="px-4 py-14 text-center text-slate-500">Không có chi nhánh nào khớp với bộ lọc hiện tại.</td></tr>
                    <tr th:each="item : ${page != null ? page.content : {}}" th:if="${page != null and not #lists.isEmpty(page.content)}" class="hover:bg-white/[0.04] transition-colors">
                        <td class="px-4 py-3"><a th:href="@{'/admin/branches/{id}'(id=${item.branchId})}" th:text="${item.name}" class="text-white font-semibold no-underline hover:text-primary transition-colors">Tên chi nhánh</a></td>
                        <td class="px-4 py-3 text-slate-300" th:text="${item.city}">Hà Nội</td>
                        <td class="px-4 py-3 text-slate-400" th:text="${item.address}">123 Đường ABC</td>
                        <td class="px-4 py-3 text-slate-400" th:text="${item.phone}">0123456789</td>
                        <td class="px-4 py-3"><th:block th:replace="~{fragments/components :: statusBadge(${item.status})}"></th:block></td>
                        <td class="px-4 py-3 text-right text-slate-400 tabular-nums" th:text="${item.hallCount != null ? item.hallCount : 0}">0</td>
                        <td class="px-4 py-3 text-slate-500 whitespace-nowrap" th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm') : ''}">01/01/2025</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center justify-center gap-1">
                                <a th:href="@{'/admin/branches/{id}'(id=${item.branchId})}" title="Xem chi tiết"
                                   class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-sky-400 hover:bg-sky-400/10 transition-all duration-200 no-underline cursor-pointer">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </a>
                                <a th:href="@{'/admin/branches/{id}/edit'(id=${item.branchId})}" title="Chỉnh sửa"
                                   class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-primary hover:bg-primary/10 transition-all duration-200 no-underline cursor-pointer">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </a>
                                <form th:action="@{'/admin/branches/{id}'(id=${item.branchId})}" method="post" class="inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này? Hành động không thể hoàn tác.');">
                                    <input type="hidden" name="_method" value="delete">
                                    <button type="submit" title="Xóa"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-danger hover:bg-danger/10 transition-all duration-200 cursor-pointer border-0 bg-transparent">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="flex items-center justify-between gap-4 px-5 py-4 border-t border-white/[0.08] bg-white/[0.02] flex-wrap" th:if="${page != null and page.totalPages > 0}">
                <div class="text-sm text-slate-400">Trang <strong class="text-slate-200" th:text="${page.number + 1}">1</strong> / <strong class="text-slate-200" th:text="${page.totalPages}">1</strong> - tổng <strong class="text-slate-200" th:text="${page.totalElements}">0</strong> chi nhánh</div>
                <div class="inline-flex items-center gap-1 flex-wrap">
                    <a th:if="${not page.first}" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number - 1},size=${page.size})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline">Trước</a>
                    <span th:if="${page.first}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">Trước</span>
                    <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                        <span th:if="${i == page.number}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 rounded-lg text-sm font-bold text-white bg-gradient-to-r from-primary to-amber-500 border border-white/20 shadow-lg shadow-primary/20" th:text="${i + 1}">1</span>
                        <a th:if="${i != page.number}" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${i},size=${page.size})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline" th:text="${i + 1}">1</a>
                    </th:block>
                    <a th:if="${not page.last}" th:href="@{/admin/branches(keyword=${criteria != null ? criteria.keyword : ''},city=${criteria != null ? criteria.city : ''},status=${criteria != null ? criteria.status : ''},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number + 1},size=${page.size})}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] cursor-pointer transition-all hover:bg-white/10 no-underline">Sau</a>
                    <span th:if="${page.last}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">Sau</span>
                </div>
            </div>
        </div>

    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
