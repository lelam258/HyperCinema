<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|Gán Manager - ${branch.name} - HyperCinema|)}"></head>
<body class="min-h-screen bg-cinema-bg text-white">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('branches')}"></nav>

<main class="hc-page">
    <div class="mx-auto max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <nav class="mb-6 flex items-center gap-2 text-sm text-cinema-muted" aria-label="Breadcrumb">
            <a th:href="@{/admin/branches}" class="text-cinema-muted no-underline hover:text-accent">Quản lý Chi nhánh</a>
            <span>/</span>
            <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}" th:text="${branch.name}" class="text-cinema-muted no-underline hover:text-accent">Tên chi nhánh</a>
            <span>/</span>
            <span class="text-white">Gán Manager</span>
        </nav>

        <div class="mb-8">
            <h1 class="hc-page-title" th:text="|Gán Manager: ${branch.name}|">Gán Manager</h1>
            <p class="hc-page-subtitle" th:text="|${branch.city}|">Thành phố</p>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <form method="post"
              th:action="@{|/admin/branches/${branch.branchId}/managers|}"
              th:object="${assignRequest}"
              class="space-y-5">
            <section class="hc-card p-6">
                <div class="mb-5 flex items-center justify-between gap-3 border-b border-cinema-border pb-4">
                    <h2 class="font-serif text-lg text-white">Manager chưa được gán</h2>
                    <span class="hc-badge border-cinema-border bg-cinema-panel-soft text-cinema-muted" th:text="|${candidates != null ? #lists.size(candidates) : 0} người|">0 người</span>
                </div>

                <div th:if="${candidates == null or #lists.isEmpty(candidates)}" class="rounded-xl border border-dashed border-cinema-border bg-cinema-panel-soft px-4 py-10 text-center text-sm text-cinema-muted">
                    Không có Manager phù hợp để gán cho chi nhánh này.
                </div>

                <ul th:if="${candidates != null and !#lists.isEmpty(candidates)}" class="space-y-3">
                    <li th:each="candidate : ${candidates}">
                        <label class="flex cursor-pointer items-center gap-4 rounded-xl border border-cinema-border bg-cinema-panel-soft p-4 transition-colors hover:border-primary/60 hover:bg-cinema-panel">
                            <input type="radio" th:field="*{userId}" th:value="${candidate.userId}" required class="h-4 w-4 accent-[#E50914]">
                            <span class="min-w-0 flex-1">
                                <span class="block font-semibold text-white" th:text="${candidate.fullName}">Họ và tên</span>
                                <span class="block truncate text-sm text-cinema-muted" th:text="${candidate.email}">email@example.com</span>
                            </span>
                            <span class="hidden text-sm text-cinema-muted sm:inline" th:text="${candidate.phone}">0xxxxxxxxx</span>
                        </label>
                    </li>
                </ul>
                <span th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="mt-3 block text-xs text-danger">Lỗi chọn Manager</span>
            </section>

            <div class="flex justify-end gap-3">
                <a class="hc-btn no-underline" th:href="@{/admin/branches/{id}(id=${branch.branchId})}">Hủy</a>
                <button type="submit" class="hc-btn hc-btn-primary" th:disabled="${candidates == null or #lists.isEmpty(candidates)}">Gán Manager</button>
            </div>
        </form>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
