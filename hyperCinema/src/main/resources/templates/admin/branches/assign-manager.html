<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|Gán Manager - ${branch.name} - HyperCinema|)}">
    <title>Gán Manager - ${branch.name} - HyperCinema</title>
</head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('branches')}"></nav>

<main class="md:ml-64 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-8">

        <nav class="flex items-center gap-2 text-sm text-slate-400 mb-6" aria-label="Breadcrumb">
            <a th:href="@{/admin/branches}" class="text-slate-400 hover:text-primary transition-colors no-underline">Quản lý Chi nhánh</a>
            <span class="text-slate-600">/</span>
            <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}" class="text-slate-400 hover:text-primary transition-colors no-underline" th:text="${branch.name}">Tên chi nhánh</a>
            <span class="text-slate-600">/</span>
            <span class="text-slate-200">Gán Manager</span>
        </nav>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Gán Manager</h1>
            <p class="text-sm text-slate-400 mt-1">
                <span th:text="${branch.city}">Thành phố</span>
                <span th:if="${branch.address}"> - </span>
                <span th:if="${branch.address}" th:text="${branch.address}">Địa chỉ</span>
            </p>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <form method="post"
              th:action="@{'/admin/branches/{id}/managers'(id=${branch.branchId})}"
              th:object="${assignRequest}">

            <div class="glass-card p-6 md:p-8">
                <h2 class="text-lg font-semibold text-white mb-4">
                    Manager chưa được gán
                    <span class="text-sm font-normal text-slate-400" th:text="|${candidates != null ? #lists.size(candidates) : 0} người|">0 người</span>
                </h2>

                <div th:if="${candidates == null or #lists.isEmpty(candidates)}" class="text-sm text-slate-500 py-4 text-center">
                    Không có Manager nào chưa được gán.
                </div>

                <div th:if="${candidates != null and !#lists.isEmpty(candidates)}" class="space-y-2">
                    <label th:each="candidate : ${candidates}"
                           class="grid grid-cols-[auto_1fr_auto] gap-4 items-center p-4 rounded-xl border border-white/10 bg-white/[0.04] hover:bg-white/[0.07] cursor-pointer transition-colors">
                        <input type="radio" th:field="*{userId}" th:value="${candidate.userId}"
                               class="w-4 h-4 accent-[#CA8A04] cursor-pointer">
                        <span class="min-w-0">
                            <span class="block text-white font-medium truncate" th:text="${candidate.fullName}">Họ tên</span>
                            <span class="block text-sm text-slate-400 truncate" th:text="${candidate.email}">email@example.com</span>
                        </span>
                        <th:block th:replace="~{fragments/components :: statusBadge(${candidate.status})}"></th:block>
                    </label>
                </div>

                <span th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="block text-xs text-danger mt-3"></span>
            </div>

            <div class="flex items-center justify-end gap-3 mt-5">
                <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}"
                   class="px-5 py-2.5 text-sm font-medium text-slate-300 bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline cursor-pointer">Hủy</a>
                <button type="submit"
                        th:disabled="${candidates == null or #lists.isEmpty(candidates)}"
                        class="px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">Gán Manager</button>
            </div>
        </form>

    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
