<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(|Gán Staff - ${branch.name} - HyperCinema|)}">
    <title>Gán Staff - ${branch.name} - HyperCinema</title>
</head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('branches')}"></nav>

<main class="md:ml-64 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-8">

        <nav class="flex items-center gap-2 text-sm text-slate-400 mb-6" aria-label="Breadcrumb">
            <a th:href="@{/admin/branches}" class="text-slate-400 hover:text-primary transition-colors no-underline">Quản lý Chi nhánh</a>
            <span class="text-slate-600">/</span>
            <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}" class="text-slate-400 hover:text-primary transition-colors no-underline" th:text="${branch.name}">Tên chi nhánh</a>
            <span class="text-slate-600">/</span>
            <span class="text-slate-200">Gán Staff</span>
        </nav>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Gán Staff</h1>
            <p class="text-sm text-slate-400 mt-1">
                <span th:text="${branch.city}">Thành phố</span>
                <span th:if="${branch.address}"> - </span>
                <span th:if="${branch.address}" th:text="${branch.address}">Địa chỉ</span>
            </p>
        </div>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <div class="glass-card p-6 md:p-8">
            <form method="post"
                  th:action="@{'/admin/branches/{id}/staff'(id=${branch.branchId})}"
                  th:object="${assignStaffRequest}"
                  class="space-y-5">

                <div>
                    <label for="staff-userId" class="block text-sm font-medium text-slate-400 mb-2">Nhân viên</label>
                    <select id="staff-userId" th:field="*{userId}" required
                            class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="">-- Chọn Staff chưa được gán --</option>
                        <option th:each="staff : ${staffCandidates}" th:value="${staff.userId}" th:text="|${staff.fullName} (${staff.email})|">Họ tên (email)</option>
                    </select>
                    <span th:if="${staffCandidates == null or #lists.isEmpty(staffCandidates)}" class="block text-xs text-warning mt-1">Không có Staff nào chưa được gán.</span>
                    <span th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="block text-xs text-danger mt-1"></span>
                </div>

                <div>
                    <label for="staff-managerId" class="block text-sm font-medium text-slate-400 mb-2">Manager phụ trách</label>
                    <select id="staff-managerId" th:field="*{managerId}" required
                            class="w-full px-4 py-3 bg-white/[0.06] border border-white/10 rounded-xl text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer appearance-none">
                        <option value="">-- Chọn Manager của Chi nhánh --</option>
                        <option th:each="manager : ${managerCandidates}" th:value="${manager.userId}" th:text="|${manager.fullName} (${manager.email})|">Họ tên (email)</option>
                    </select>
                    <span th:if="${managerCandidates == null or #lists.isEmpty(managerCandidates)}" class="block text-xs text-warning mt-1">Chi nhánh chưa có Manager. Hãy gán Manager trước.</span>
                    <span th:if="${#fields.hasErrors('managerId')}" th:errors="*{managerId}" class="block text-xs text-danger mt-1"></span>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/[0.08]">
                    <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}"
                       class="px-5 py-2.5 text-sm font-medium text-slate-300 bg-white/[0.06] border border-white/10 rounded-xl hover:bg-white/10 transition-all no-underline cursor-pointer">Hủy</a>
                    <button type="submit"
                            th:disabled="${staffCandidates == null or #lists.isEmpty(staffCandidates) or managerCandidates == null or #lists.isEmpty(managerCandidates)}"
                            class="px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">Gán Staff</button>
                </div>
            </form>
        </div>

    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
