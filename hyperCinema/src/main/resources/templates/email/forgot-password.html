<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset your HyperCinema password</title>
</head>
<body style="margin:0;padding:0;background:#111111;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#111111;padding:32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#1f1f1f;border:1px solid #333333;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px 18px 32px;border-bottom:1px solid #333333;">
                            <h1 style="margin:0;color:#ffffff;font-size:24px;line-height:32px;">HyperCinema</h1>
                            <p style="margin:8px 0 0 0;color:#b8b8b8;font-size:14px;">Password reset</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin:0 0 12px 0;color:#ffffff;font-size:20px;line-height:28px;">Reset your password</h2>
                            <p style="margin:0 0 20px 0;color:#d8d8d8;font-size:15px;line-height:24px;">
                                We received a request to reset your password. Use the code below or click the button to continue.
                            </p>

                            <div style="margin:24px 0;padding:18px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;text-align:center;">
                                <div style="color:#aaaaaa;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Reset code</div>
                                <div th:text="${code}" style="margin-top:8px;color:#ffffff;font-size:32px;font-weight:700;letter-spacing:6px;">123456</div>
                            </div>

                            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:24px 0;">
                                <tr>
                                    <td style="background:#ff3b30;border-radius:6px;">
                                        <a th:href="${resetUrl}" href="#" style="display:inline-block;padding:13px 20px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">Reset password</a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:0;color:#b8b8b8;font-size:13px;line-height:20px;">
                                This code expires in <span th:text="${expireText}">15 minutes</span>. If you did not request a password reset, you can ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
