<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Shared component fragments aligned with the template-driven dark UI. -->
<body>

<th:block th:fragment="statusBadge(status)" th:switch="${status}">
    <span th:case="'ComingSoon'" class="hc-badge border-info/30 bg-info/10 text-info">Sắp chiếu</span>
    <span th:case="'NowShowing'" class="hc-badge border-success/30 bg-success/10 text-success">Đang chiếu</span>
    <span th:case="'Ended'" class="hc-badge border-cinema-border bg-white/10 text-cinema-muted">Đã kết thúc</span>
    <span th:case="'Active'" class="hc-badge border-success/30 bg-success/10 text-success">Hoạt động</span>
    <span th:case="'Maintenance'" class="hc-badge border-warning/30 bg-warning/10 text-warning">Bảo trì</span>
    <span th:case="'Inactive'" class="hc-badge border-cinema-border bg-white/10 text-cinema-muted">Ngừng hoạt động</span>
    <span th:case="*" class="hc-badge border-cinema-border bg-white/10 text-cinema-muted" th:text="${status != null ? status : 'Không xác định'}">Không xác định</span>
</th:block>

<th:block th:fragment="alert(type, messageKey)">
    <div role="alert"
         th:if="${not #strings.isEmpty(messageKey)}"
         th:classappend="${type == 'success'} ? 'bg-success/10 border-success/30 text-success' :
                          (${type == 'error'} ? 'bg-danger/10 border-danger/30 text-danger' :
                          (${type == 'warning'} ? 'bg-warning/10 border-warning/30 text-warning' :
                          'bg-info/10 border-info/30 text-info'))"
         class="mb-4 flex items-start gap-3 rounded-xl border px-4 py-3 text-sm">
        <span class="alert-icon" th:insert="~{fragments/icons :: icon(${type == 'success' ? 'check-circle' : (type == 'error' ? 'x-circle' : (type == 'warning' ? 'alert-triangle' : 'info'))})}"></span>
        <span th:if="${not #strings.isEmpty(messageKey)}" th:text="#{__${messageKey}__}">Thông báo</span>
        <span th:unless="${not #strings.isEmpty(messageKey)}">Thông báo</span>
    </div>
</th:block>

<th:block th:fragment="flashes">
    <th:block th:if="${#ctx.containsVariable('successKey') and not #strings.isEmpty(successKey)}" th:replace="~{fragments/components :: alert('success', ${successKey})}"></th:block>
    <th:block th:if="${#ctx.containsVariable('errorKey') and not #strings.isEmpty(errorKey)}" th:replace="~{fragments/components :: alert('error', ${errorKey})}"></th:block>
    <th:block th:if="${#ctx.containsVariable('infoKey') and not #strings.isEmpty(infoKey)}" th:replace="~{fragments/components :: alert('info', ${infoKey})}"></th:block>
    <th:block th:if="${#ctx.containsVariable('warningKey') and not #strings.isEmpty(warningKey)}" th:replace="~{fragments/components :: alert('warning', ${warningKey})}"></th:block>
    <th:block th:if="${#ctx.containsVariable('successMessage') and not #strings.isEmpty(successMessage)}" th:replace="~{fragments/components :: alert('success', ${successMessage})}"></th:block>
    <th:block th:if="${#ctx.containsVariable('errorMessage') and not #strings.isEmpty(errorMessage)}" th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></th:block>
</th:block>

<th:block th:fragment="pagination(page, criteria, baseUrl)">
    <div class="flex flex-wrap items-center justify-between gap-4 border-t border-cinema-border bg-cinema-sidebar px-5 py-4"
         th:if="${page != null and page.totalPages > 0}">
        <div class="text-sm text-cinema-muted">
            Trang <strong class="text-white" th:text="${page.number + 1}">1</strong>
            / <strong class="text-white" th:text="${page.totalPages}">1</strong>
            - tổng <strong class="text-white" th:text="${page.totalElements}">0</strong>
        </div>
        <div class="inline-flex flex-wrap items-center gap-1">
            <a th:if="${not page.first}"
               th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number - 1},size=${page.size})}"
               class="hc-btn h-9 min-w-9 px-3 py-0 no-underline">Trước</a>
            <span th:if="${page.first}" class="inline-flex h-9 min-w-9 cursor-not-allowed items-center justify-center px-3 text-sm text-gray-600">Trước</span>

            <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                <span th:if="${i == page.number}" class="inline-flex h-9 min-w-9 items-center justify-center rounded-lg border border-primary bg-primary px-3 text-sm font-bold text-white shadow-[0_0_14px_rgba(229,9,20,0.25)]" th:text="${i + 1}">1</span>
                <a th:if="${i != page.number}"
                   th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${i},size=${page.size})}"
                   class="hc-btn h-9 min-w-9 px-3 py-0 no-underline"
                   th:text="${i + 1}">1</a>
            </th:block>

            <a th:if="${not page.last}"
               th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number + 1},size=${page.size})}"
               class="hc-btn h-9 min-w-9 px-3 py-0 no-underline">Sau</a>
            <span th:if="${page.last}" class="inline-flex h-9 min-w-9 cursor-not-allowed items-center justify-center px-3 text-sm text-gray-600">Sau</span>
        </div>
    </div>
</th:block>

</body>
</html>
