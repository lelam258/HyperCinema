<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    Shared Components (Tailwind CSS) — fragments/components.html
    ============================================================
    statusBadge(status), alert(type, messageKey), flashes,
    pagination(page, criteria, baseUrl)
-->
<body>

<!-- statusBadge(status) — Badge trạng thái -->
<th:block th:fragment="statusBadge(status)" th:switch="${status}">
    <span th:case="'ComingSoon'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-info/15 border border-info/30 text-info"
          th:text="${status}">ComingSoon</span>
    <span th:case="'NowShowing'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-success/15 border border-success/30 text-success"
          th:text="${status}">NowShowing</span>
    <span th:case="'Ended'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-white/10 border border-white/20 text-slate-300"
          th:text="${status}">Ended</span>
    <span th:case="'Active'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-success/15 border border-success/30 text-success"
          th:text="${status}">Active</span>
    <span th:case="'Maintenance'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-warning/15 border border-warning/30 text-warning"
          th:text="${status}">Maintenance</span>
    <span th:case="'Inactive'"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-white/10 border border-white/20 text-slate-300"
          th:text="${status}">Inactive</span>
    <span th:case="*"
          class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wide bg-white/10 border border-white/20 text-slate-400"
          th:text="'Không xác định'">Không xác định</span>
</th:block>

<!-- alert(type, messageKey) — Alert notification -->
<th:block th:fragment="alert(type, messageKey)">
    <div role="alert"
         th:classappend="${type == 'success'} ? 'bg-success/10 border-success/25 text-success' :
                          (${type == 'error'} ? 'bg-danger/10 border-danger/25 text-danger' :
                          (${type == 'warning'} ? 'bg-warning/10 border-warning/25 text-warning' :
                          'bg-info/10 border-info/25 text-info'))"
         class="flex items-start gap-3 px-4 py-3 border rounded-xl mb-4 text-sm backdrop-blur-sm">
        <span class="alert-icon" th:insert="~{fragments/icons :: icon(${type == 'success' ? 'check-circle' : (type == 'error' ? 'x-circle' : (type == 'warning' ? 'alert-triangle' : 'info'))})}"></span>
        <span th:text="#{__${messageKey}__}">Thông báo</span>
    </div>
</th:block>

<!-- flashes — Flash messages -->
<th:block th:fragment="flashes">
    <th:block th:if="${successKey}">
        <th:block th:replace="~{fragments/components :: alert('success', ${successKey})}"></th:block>
    </th:block>
    <th:block th:if="${errorKey}">
        <th:block th:replace="~{fragments/components :: alert('error', ${errorKey})}"></th:block>
    </th:block>
    <th:block th:if="${infoKey}">
        <th:block th:replace="~{fragments/components :: alert('info', ${infoKey})}"></th:block>
    </th:block>
    <th:block th:if="${warningKey}">
        <th:block th:replace="~{fragments/components :: alert('warning', ${warningKey})}"></th:block>
    </th:block>
</th:block>

<!-- pagination(page, criteria, baseUrl) — Phân trang -->
<th:block th:fragment="pagination(page, criteria, baseUrl)">
    <div class="flex items-center justify-between gap-4 px-5 py-4 border-t border-white/[0.08] bg-white/[0.02] flex-wrap" th:if="${page != null and page.totalPages > 0}">
        <div class="text-sm text-slate-400">
            Trang <strong class="text-slate-200" th:text="${page.number + 1}">1</strong>
            / <strong class="text-slate-200" th:text="${page.totalPages}">1</strong>
            — tổng <strong class="text-slate-200" th:text="${page.totalElements}">0</strong>
        </div>
        <div class="inline-flex items-center gap-1 flex-wrap">
            <!-- Trước -->
            <a th:if="${not page.first}"
               th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number - 1},size=${page.size})}"
               class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] backdrop-blur-sm cursor-pointer transition-all duration-200 hover:bg-white/10 hover:border-white/20 no-underline">
                ‹ Trước
            </a>
            <span th:if="${page.first}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">‹ Trước</span>

            <!-- Số trang -->
            <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                <span th:if="${i == page.number}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 rounded-lg text-sm font-bold text-white bg-gradient-to-r from-primary to-amber-500 border border-white/20 shadow-lg shadow-primary/20" th:text="${i + 1}">1</span>
                <a th:if="${i != page.number}"
                   th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${i},size=${page.size})}"
                   class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] backdrop-blur-sm cursor-pointer transition-all duration-200 hover:bg-white/10 hover:border-white/20 no-underline"
                   th:text="${i + 1}">1</a>
            </th:block>

            <!-- Sau -->
            <a th:if="${not page.last}"
               th:href="@{${baseUrl}(keyword=${criteria != null ? criteria.keyword : null},status=${criteria != null ? criteria.status : null},city=${param.city},languageId=${param.languageId},genreId=${param.genreId},releaseDateFrom=${param.releaseDateFrom},releaseDateTo=${param.releaseDateTo},sort=${criteria != null ? criteria.sort : 'createdAt'},direction=${criteria != null ? criteria.direction : 'DESC'},page=${page.number + 1},size=${page.size})}"
               class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 border border-white/10 rounded-lg text-sm text-slate-200 bg-white/[0.04] backdrop-blur-sm cursor-pointer transition-all duration-200 hover:bg-white/10 hover:border-white/20 no-underline">
                Sau ›
            </a>
            <span th:if="${page.last}" class="inline-flex items-center justify-center min-w-[36px] h-9 px-3 text-sm text-slate-600 cursor-not-allowed">Sau ›</span>
        </div>
    </div>
</th:block>

</body>
</html>
