<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    =========================================================================
    Layout_Fragment - fragments/icons.html  (Task 3.1)
    =========================================================================
    Cung cap mot fragment Thymeleaf `icon(name)` render bieu tuong SVG inline
    duoc chon theo tham so `name`. Day la "SVG sprite" dang Thymeleaf de cac
    trang admin/error va fragment `components.html` tai su dung (Req 9.2).

    NGUYEN TAC THIET KE
    =========================================================================
    * Bo icon nhat quan: lay tu Lucide (https://lucide.dev) - line icons,
      viewBox 24x24, stroke-width 2, net bo tron. Dong bo voi cac icon SVG
      da co san trong error/movie-not-found.html va error/movie-forbidden.html.
    * Moi <svg> dung viewBox="0 0 24 24" va stroke="currentColor" (line icon)
      hoac fill="currentColor" (solid icon) => icon ke thua MAU CHU cua phan
      tu cha (color), bao dam tuong phan nhat quan voi token mau.
    * Sizing nhat quan: KHONG dat width/height cung tren <svg>; them
      class="icon" de CSS (theme.css hoac ngu canh nut/badge) kiem soat kich
      thuoc - dung cach cac template hien co dang lam (vd. `.btn svg`).
    * KHONG dung ky tu emoji lam bieu tuong UI (Req 9.2) - tat ca la SVG.
    * aria-hidden="true" + focusable="false": icon mang tinh trang tri; nhan
      van ban do phan tu cha cung cap (Req 8.3, 8.4).
    * th:case="*" (fallback): neu `name` khong khop icon nao => render RONG
      (khong co output) mot cach an toan, thay vi loi hay ky tu la.

    CACH DUNG
    =========================================================================
        <span th:replace="~{fragments/icons :: icon('search')}"></span>
        <a class="btn btn-primary" th:href="@{/admin/movies}">
            <span th:replace="~{fragments/icons :: icon('arrow-left')}"></span>
            Ve danh sach Phim
        </a>

    DANH SACH TEN ICON (name) hop le:
      dieu huong : arrow-left, arrow-right, chevron-up, chevron-down,
                   chevron-left, chevron-right, sort
      bao mat    : lock, key
      tim kiem   : search, search-x
      trang thai : check-circle (success), x-circle (error), alert-triangle
                   (warning), info, x (close)
      hanh dong  : plus (tao moi), pencil (sua), trash (xoa)
      linh vuc   : film (phim), building (chi nhanh)
    =========================================================================
-->
<body>

<!--
    Fragment icon(name): th:switch tren ${name}; moi th:case render dung mot
    <svg>. th:block lam goc fragment => KHONG sinh the bao boc thua khi
    th:replace, chi chen dung <svg> duoc chon vao vi tri goi.
-->
<th:block th:fragment="icon(name)" th:switch="${name}">

    <!-- ===== Dieu huong (Navigation) ===== -->

    <!-- arrow-left: nut "Quay lai / Ve danh sach" -->
    <svg th:case="'arrow-left'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>

    <!-- arrow-right -->
    <svg th:case="'arrow-right'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
    </svg>

    <!-- chevron-up: chi bao sort tang dan (thay glyph '^') -->
    <svg th:case="'chevron-up'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="18 15 12 9 6 15"></polyline>
    </svg>

    <!-- chevron-down: chi bao sort giam dan / mui ten select -->
    <svg th:case="'chevron-down'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="6 9 12 15 18 9"></polyline>
    </svg>

    <!-- chevron-left: phan trang "Truoc" -->
    <svg th:case="'chevron-left'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>

    <!-- chevron-right: phan trang "Sau" -->
    <svg th:case="'chevron-right'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="9 18 15 12 9 6"></polyline>
    </svg>

    <!-- sort: bieu tuong sap xep (up-down) cho header bang sort duoc -->
    <svg th:case="'sort'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m21 16-4 4-4-4"></path>
        <path d="M17 20V4"></path>
        <path d="m3 8 4-4 4 4"></path>
        <path d="M7 4v16"></path>
    </svg>

    <!-- ===== Bao mat (Security) ===== -->

    <!-- lock: trang loi 403 / truy cap bi tu choi -->
    <svg th:case="'lock'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <!-- key -->
    <svg th:case="'key'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="7.5" cy="15.5" r="5.5"></circle>
        <path d="m21 2-9.6 9.6"></path>
        <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
    </svg>

    <!-- ===== Tim kiem (Search) ===== -->

    <!-- search: kinh lup - nut loc/tim kiem -->
    <svg th:case="'search'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>

    <!-- search-x: kinh lup gach cheo - trang thai "khong tim thay" (404) -->
    <svg th:case="'search-x'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="8" y1="8" x2="14" y2="14"></line>
        <line x1="14" y1="8" x2="8" y2="14"></line>
    </svg>

    <!-- ===== Trang thai (Status / Alert) ===== -->

    <!-- check-circle: alert success -->
    <svg th:case="'check-circle'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="9 12 11.5 14.5 16 9.5"></polyline>
    </svg>

    <!-- x-circle: alert error -->
    <svg th:case="'x-circle'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>

    <!-- alert-triangle: alert warning / canh bao -->
    <svg th:case="'alert-triangle'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>

    <!-- info: alert info -->
    <svg th:case="'info'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>

    <!-- x: dong / xoa bo loc -->
    <svg th:case="'x'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>

    <!-- ===== Hanh dong (Actions) ===== -->

    <!-- plus: nut "Tao moi" -->
    <svg th:case="'plus'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>

    <!-- pencil: nut "Sua" -->
    <svg th:case="'pencil'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
        <path d="m15 5 4 4"></path>
    </svg>

    <!-- trash: nut "Xoa" -->
    <svg th:case="'trash'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
    </svg>

    <!-- ===== Linh vuc (Domain) ===== -->

    <!-- film: Quan ly Phim -->
    <svg th:case="'film'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <path d="M7 3v18"></path>
        <path d="M3 7.5h4"></path>
        <path d="M3 12h18"></path>
        <path d="M3 16.5h4"></path>
        <path d="M17 3v18"></path>
        <path d="M17 7.5h4"></path>
        <path d="M17 16.5h4"></path>
    </svg>

    <!-- building: Quan ly Chi nhanh -->
    <svg th:case="'building'" class="icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
        <path d="M9 22v-4h6v4"></path>
        <path d="M8 6h.01"></path>
        <path d="M16 6h.01"></path>
        <path d="M12 6h.01"></path>
        <path d="M12 10h.01"></path>
        <path d="M12 14h.01"></path>
        <path d="M16 10h.01"></path>
        <path d="M16 14h.01"></path>
        <path d="M8 10h.01"></path>
        <path d="M8 14h.01"></path>
    </svg>

    <!--
        Fallback (an toan voi name la): khong khop icon nao => render RONG.
        th:block khong sinh the => khong co output, khong loi, khong ky tu la.
    -->
    <th:block th:case="*"></th:block>

</th:block>

</body>
</html>
