<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bán vé tại quầy - HyperCinema')}">
    <title>Bán vé tại quầy - HyperCinema</title>
</head>
<body class="min-h-screen">
<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: staffSidebar('booking')}"></nav>
<main class="md:ml-64 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="mb-8 flex items-center justify-between flex-wrap gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight mb-1">Bán vé tại quầy</h1>
                <p class="text-sm text-slate-400" th:text="'Quản lý bán vé cho chi nhánh: ' + ${branchName}">Quản lý bán vé cho chi nhánh: Chi nhánh 1</p>
            </div>
            <div class="text-xs text-slate-500 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl">
                Cập nhật lúc: <span th:text="${lastUpdated}">10:00</span>
            </div>
        </div>

        <!-- Showtime List -->
        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-white/[0.08] bg-white/[0.02]">
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400">Phim</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400">Phòng chiếu</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400">Loại phòng</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400">Bắt đầu</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400">Kết thúc</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400 text-right">Giá vé cơ bản</th>
                            <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-400 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-white/[0.04]">
                        <tr th:each="s : ${showtimes}" class="hover:bg-white/[0.02] transition-colors">
                            <td class="px-6 py-4">
                                <span class="block text-sm font-bold text-white" th:text="${s.movie.title}">Tên phim</span>
                                <span class="block text-xs text-slate-500" th:text="${s.movie.duration} + ' phút'">120 phút</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-300" th:text="${s.hall.name}">Phòng 1</td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-info/10 text-info border border-info/20" 
                                      th:text="${s.hall.hallType}">
                                    2D
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm font-semibold text-white" th:text="${#temporals.format(s.startTime, 'HH:mm dd/MM/yyyy')}">10:00</td>
                            <td class="px-6 py-4 text-sm text-slate-400" th:text="${#temporals.format(s.endTime, 'HH:mm dd/MM/yyyy')}">12:00</td>
                            <td class="px-6 py-4 text-sm font-bold text-right text-primary tabular-nums" th:text="${#numbers.formatDecimal(s.price, 0, 'POINT', 0, 'POINT')} + ' đ'">80.000 đ</td>
                            <td class="px-6 py-4 text-center">
                                <a th:href="@{'/staff/booking/' + ${s.showtimeId}}" 
                                   class="inline-flex items-center justify-center px-3.5 py-1.5 text-xs font-semibold text-white bg-gradient-to-r from-primary to-amber-500 rounded-lg hover:shadow-md hover:shadow-primary/20 transition-all duration-300 no-underline cursor-pointer">
                                    Bán vé
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${showtimes == null or #lists.isEmpty(showtimes)}">
                            <td colspan="7" class="px-6 py-12 text-center text-sm text-slate-500">
                                Không có suất chiếu nào hoạt động hôm nay cho chi nhánh của bạn.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
</body>
</html>
