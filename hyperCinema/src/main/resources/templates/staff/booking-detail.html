<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bán vé tại quầy - Chọn ghế - HyperCinema')}">
    <title>Bán vé tại quầy - Chọn ghế - HyperCinema</title>
</head>
<body class="min-h-screen">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: staffSidebar('booking')}"></nav>

<main class="md:ml-64 min-h-screen flex flex-col">
    <div class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">
        
        <!-- Breadcrumb & Back -->
        <nav class="flex items-center gap-2 text-sm text-slate-400 mb-6" aria-label="Breadcrumb">
            <a th:href="@{/staff/booking}" class="text-slate-400 hover:text-primary transition-colors no-underline">Danh sách suất chiếu</a>
            <span class="text-slate-600">/</span>
            <span class="text-slate-200">Chọn ghế ngồi</span>
        </nav>

        <div th:replace="~{fragments/components :: flashes}"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- Left: Interactive Seat Map -->
            <div class="lg:col-span-2 glass-card p-6">
                <div class="flex items-center justify-between gap-4 flex-wrap mb-6 border-b border-white/[0.06] pb-4">
                    <div>
                        <h2 class="text-xl font-bold text-white">Sơ đồ chọn ghế</h2>
                        <p class="text-xs text-slate-400 mt-1" th:text="|Phòng chiếu: ${showtime.hall.name} (${showtime.hall.hallType})|">Phòng 1</p>
                    </div>
                </div>

                <!-- Seat Map Board -->
                <div class="relative overflow-x-auto p-4 bg-black/20 rounded-xl border border-white/5">
                    <!-- Screen -->
                    <div class="w-full max-w-md mx-auto text-center mb-10">
                        <div class="h-1.5 w-full bg-slate-600 rounded-full shadow-[0_-4px_10px_rgba(255,255,255,0.2)]"></div>
                        <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase mt-2 block">Màn Hình Chiếu</span>
                    </div>

                    <!-- Legend -->
                    <div class="flex flex-wrap justify-center gap-4 mb-8 text-xs">
                        <div class="flex items-center gap-1.5"><div class="w-5 h-5 rounded border border-slate-500/30 bg-slate-700/20"></div><span class="text-slate-400">Standard</span></div>
                        <div class="flex items-center gap-1.5"><div class="w-5 h-5 rounded border border-primary/50 bg-primary/10"></div><span class="text-slate-400">VIP (+20k)</span></div>
                        <div class="flex items-center gap-1.5"><div class="w-10 h-5 rounded border border-pink-500/50 bg-pink-500/10"></div><span class="text-slate-400">Double</span></div>
                        <div class="flex items-center gap-1.5"><div class="w-5 h-5 rounded bg-slate-800 border border-slate-700/50"></div><span class="text-slate-500">Đã đặt</span></div>
                        <div class="flex items-center gap-1.5"><div class="w-5 h-5 rounded bg-primary border border-primary"></div><span class="text-white">Đang chọn</span></div>
                    </div>

                    <!-- Rows Grid -->
                    <div class="flex flex-col gap-3 min-w-[550px] pb-4">
                        <div th:each="row : ${#lists.sort(#lists.toList(#sets.toSet(seats.![seatRow])))}" class="flex items-center justify-center gap-3">
                            <div class="w-6 text-sm font-bold text-slate-400 text-right" th:text="${#strings.trim(row)}">A</div>
                            
                            <div class="flex items-center gap-2">
                                <div th:each="seat : ${seats}" th:if="${#strings.trim(seat.seatRow) == #strings.trim(row)}"
                                     th:data-id="${seat.seatId}"
                                     th:data-code="${seat.seatRow} + '-' + ${seat.seatNumber}"
                                     th:data-price="${seat.finalPrice}"
                                     th:data-type="${seat.type}"
                                     th:data-status="${seat.status}"
                                     th:onclick="'toggleSeatSelection(this)'"
                                     th:classappend="${seat.status == 'BOOKED'} ? 'bg-slate-800 border-slate-700/50 text-slate-500 cursor-not-allowed' : (${seat.status == 'RESERVED'} ? 'bg-amber-500/20 border-amber-500/40 text-amber-500/50 cursor-not-allowed' : (${seat.type == 'VIP'} ? 'border-primary/50 bg-primary/10 hover:bg-primary/20 text-amber-200 cursor-pointer' : (${seat.type == 'Double'} ? 'col-span-2 w-16 border-pink-500/50 bg-pink-500/10 hover:bg-pink-500/20 text-pink-200 cursor-pointer' : 'border-slate-500/30 bg-slate-700/20 hover:bg-slate-700/40 text-slate-300 cursor-pointer')))"
                                     class="w-7 h-7 rounded flex items-center justify-center text-[10px] font-bold border transition-colors select-none">
                                    <span th:text="${seat.seatNumber}">1</span>
                                </div>
                            </div>
                            
                            <div class="w-6 text-sm font-bold text-slate-400 text-left" th:text="${#strings.trim(row)}">A</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Booking summary & action -->
            <div class="glass-card p-6 flex flex-col gap-6">
                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Thông tin suất chiếu</h3>
                    <div class="space-y-2">
                        <h2 class="text-lg font-bold text-white leading-tight" th:text="${showtime.movie.title}">Tên Phim</h2>
                        <div class="text-sm text-slate-300 flex items-center gap-1.5">
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-primary/10 text-primary border border-primary/20" th:text="${showtime.hall.hallType}">2D</span>
                            <span th:text="${showtime.hall.name}">Phòng chiếu 1</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-1" th:text="|Thời gian: ${#temporals.format(showtime.startTime, 'HH:mm')} - ${#temporals.format(showtime.endTime, 'HH:mm dd/MM/yyyy')}|">
                            10:00 - 12:00 01/01/2026
                        </div>
                    </div>
                </div>

                <!-- Selected Seats Detail -->
                <div class="border-t border-white/[0.06] pt-4">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Ghế đã chọn</h3>
                    <div id="noSelectedLabel" class="text-sm text-slate-500 italic">Chưa chọn ghế nào.</div>
                    <div id="selectedSeatsContainer" class="flex flex-wrap gap-2 hidden">
                        <!-- Dynamically populated tags -->
                    </div>
                </div>

                <!-- Price Calculator -->
                <div class="border-t border-white/[0.06] pt-4 space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>Giá vé cơ bản:</span>
                        <span class="font-semibold text-white tabular-nums" th:text="${#numbers.formatDecimal(showtime.price, 0, 'POINT', 0, 'POINT')} + ' đ'">80.000 đ</span>
                    </div>
                    <div class="flex items-center justify-between text-sm border-t border-white/5 pt-2">
                        <span class="font-bold text-slate-300">TỔNG TIỀN:</span>
                        <span id="totalPriceLabel" class="text-lg font-extrabold text-primary tabular-nums">0 đ</span>
                    </div>
                </div>

                <!-- Submit Form -->
                <form th:action="@{'/staff/booking/' + ${showtime.showtimeId} + '/checkout'}" method="post" id="checkoutForm" class="border-t border-white/[0.06] pt-4">
                    <input type="hidden" id="selectedSeatsInput" name="seatIds" value="">
                    <label for="receiverName" class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Receiver Name</label>
                    <input type="text" id="receiverName" name="receiverName" required maxlength="100" autocomplete="name"
                           class="w-full mb-4 px-3 py-2.5 text-sm text-white bg-white/[0.04] border border-white/10 rounded-xl outline-none focus:border-primary/60 focus:ring-2 focus:ring-primary/10"
                           placeholder="Enter receiver name">

                    <button type="submit" id="submitBtn" disabled class="w-full py-3 text-sm font-bold text-white bg-gradient-to-r from-primary to-amber-500 rounded-xl transition-all duration-300 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed hover:shadow-lg hover:shadow-primary/20 cursor-pointer">
                        Tiến hành xuất vé (Tiền mặt)
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

<script th:inline="javascript">
    let selectedSeats = new Map(); // seatId -> { code, price }

    function toggleSeatSelection(element) {
        const id = parseInt(element.getAttribute('data-id'));
        const code = element.getAttribute('data-code');
        const price = parseInt(element.getAttribute('data-price'));
        const status = element.getAttribute('data-status');

        if (status === 'BOOKED' || status === 'RESERVED') {
            return; // Không cho click
        }

        if (selectedSeats.has(id)) {
            // Deselect
            selectedSeats.delete(id);
            element.classList.remove('bg-primary', 'border-primary', 'text-white');
            if (element.getAttribute('data-type') === 'VIP') {
                element.classList.add('border-primary/50', 'bg-primary/10', 'text-amber-200');
            } else if (element.getAttribute('data-type') === 'Double') {
                element.classList.add('border-pink-500/50', 'bg-pink-500/10', 'text-pink-200');
            } else {
                element.classList.add('border-slate-500/30', 'bg-slate-700/20', 'text-slate-300');
            }
        } else {
            // Select
            selectedSeats.set(id, { code, price });
            element.classList.remove('border-primary/50', 'bg-primary/10', 'text-amber-200', 'border-pink-500/50', 'bg-pink-500/10', 'text-pink-200', 'border-slate-500/30', 'bg-slate-700/20', 'text-slate-300');
            element.classList.add('bg-primary', 'border-primary', 'text-white');
        }

        updateSummary();
    }

    function updateSummary() {
        const container = document.getElementById('selectedSeatsContainer');
        const noLabel = document.getElementById('noSelectedLabel');
        const totalLabel = document.getElementById('totalPriceLabel');
        const hiddenInput = document.getElementById('selectedSeatsInput');
        const submitBtn = document.getElementById('submitBtn');

        container.innerHTML = '';
        let totalPrice = 0;
        let selectedIds = [];

        if (selectedSeats.size === 0) {
            noLabel.classList.remove('hidden');
            container.classList.add('hidden');
            totalLabel.innerText = '0 đ';
            hiddenInput.value = '';
            submitBtn.disabled = true;
        } else {
            noLabel.classList.add('hidden');
            container.classList.remove('hidden');
            submitBtn.disabled = false;

            selectedSeats.forEach((value, key) => {
                selectedIds.push(key);
                totalPrice += value.price;

                // Create seat tag
                const tag = document.createElement('span');
                tag.className = 'inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold text-white bg-primary/20 border border-primary/30';
                tag.innerText = value.code;
                container.appendChild(tag);
            });

            totalLabel.innerText = totalPrice.toLocaleString('vi-VN') + ' đ';
            hiddenInput.value = selectedIds.join(',');
        }
    }
</script>

</body>
</html>
