#            10.5, 12.x.
# =============================================================================

# -----------------------------------------------------------------------------
# Error keys — Bean Validation / Business validation (HTTP 400)
# -----------------------------------------------------------------------------
movie.duplicate_title_on_release_date = Đã tồn tại Phim có tiêu đề này với cùng ngày phát hành.
movie.language_not_found = Ngôn ngữ được chọn không tồn tại.
movie.genre_not_found = Thể loại được chọn không tồn tại.
movie.genre_limit_exceeded = Một Phim không được gắn quá 10 thể loại.
movie.status.invalid = Trạng thái phim không hợp lệ.
movie.invalid_status_transition = Không thể chuyển trực tiếp từ ComingSoon sang Ended khi Phim chưa từng NowShowing.
movie.cannot_end_with_future_showtimes = Không thể kết thúc phát hành khi vẫn còn lịch chiếu trong tương lai.
movie.cannot_delete_with_showtimes = Không thể xóa Phim đang còn lịch chiếu.
