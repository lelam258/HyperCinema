movie.update.no_change = Không có thay đổi nào được lưu.
movie.search.status_ignored = Bộ lọc trạng thái không hợp lệ và đã bị bỏ qua.
movie.search.release_date_range_ignored = Khoảng ngày phát hành không hợp lệ và đã bị bỏ qua.

# -----------------------------------------------------------------------------
# Success keys (toast/flash sau redirect)
