# =============================================================================
# Branch Management — i18n message bundle (vi)
# =============================================================================
# Bundle locale `vi` cho module Quản lý Chi nhánh. Nội dung đồng bộ với
# messages.properties (locale mặc định cũng là tiếng Việt — dự án Vietnamese-
# first) để tránh fallback bất nhất khi client gửi Accept-Language: vi.
#
# Nguồn: design.md §B.3.3 (bảng error key) và §B.8.3 (mapping → message).
# Trace REQ: 3.4, 3.5, 3.6, 3.7, 4.8, 5.7, 6.5, 6.7, 7.1, 7.2, 7.4, 8.1–8.4,
#            9.1–9.6, 10.1–10.4, 11.4, 12.x.
# =============================================================================

# -----------------------------------------------------------------------------
# Error keys — Bean Validation / Business validation (HTTP 400)
# -----------------------------------------------------------------------------
branch.duplicate_name_in_city = Đã tồn tại Chi nhánh có tên này trong cùng thành phố.
branch.time_range.invalid = Giờ mở cửa phải sớm hơn giờ đóng cửa.
branch.status.invalid = Trạng thái không hợp lệ. Chỉ chấp nhận Active, Inactive hoặc Maintenance.
branch.cannot_deactivate_with_future_showtimes = Không thể chuyển sang Inactive khi vẫn còn lịch chiếu trong tương lai.
branch.cannot_delete_with_halls = Không thể xóa Chi nhánh đang còn phòng chiếu.
branch.cannot_delete_with_users = Không thể xóa Chi nhánh đang còn nhân sự.
branch.assign_manager.role_invalid = Người dùng được chọn không phải Manager.
branch.manager_conflict = Chi nhánh đã có Manager đang hoạt động.
branch.assign_staff.role_invalid = Người dùng được chọn không phải Staff.
branch.assign_staff.manager_branch_mismatch = Manager không thuộc Chi nhánh được chọn.

# -----------------------------------------------------------------------------
# Error keys — Lookup / Authorization (HTTP 404 / 403)
# -----------------------------------------------------------------------------
branch.not_found = Không tìm thấy Chi nhánh.
branch.access_denied = Bạn không có quyền truy cập Chi nhánh này.

# -----------------------------------------------------------------------------
# Info / Warning keys
# -----------------------------------------------------------------------------
branch.update.no_change = Không có thay đổi nào được lưu.
branch.search.status_ignored = Giá trị trạng thái không hợp lệ đã bị bỏ qua khi tìm kiếm.

# -----------------------------------------------------------------------------
# Success keys (toast/flash sau redirect)
# -----------------------------------------------------------------------------
branch.create.success = Tạo Chi nhánh thành công.
branch.update.success = Cập nhật Chi nhánh thành công.
branch.delete.success = Xóa Chi nhánh thành công.
branch.status.changed = Đã cập nhật trạng thái Chi nhánh.
branch.manager.assigned = Đã gán Manager cho Chi nhánh.
branch.manager.unassigned = Đã bỏ gán Manager khỏi Chi nhánh.
branch.staff.assigned = Đã gán Nhân viên cho Chi nhánh.
branch.staff.unassigned = Đã bỏ gán Nhân viên khỏi Chi nhánh.

# =============================================================================
# Movie Management — i18n message bundle (vi)
# =============================================================================
# Bundle locale `vi` cho module Quản lý Phim. Nội dung đồng bộ với
# messages.properties (locale mặc định cũng là tiếng Việt — dự án Vietnamese-
# first) để tránh fallback bất nhất khi client gửi Accept-Language: vi.
# Nguồn: design.md §B.3.3 (bảng error key) và §B.8.3 (mapping key → message).
