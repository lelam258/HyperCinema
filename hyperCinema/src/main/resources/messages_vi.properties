movie.cannot_delete_with_favorites = Không thể xóa Phim đang được khách hàng yêu thích.
movie.branch_not_found = Chi nhánh được chọn không tồn tại.
movie.cannot_assign_ended_movie = Không thể phân phối Phim đã kết thúc phát hành.
movie.cannot_unassign_with_future_showtimes = Không thể gỡ phân phối khi Chi nhánh còn lịch chiếu Phim này trong tương lai.
movie.poster_url.invalid = URL poster không hợp lệ (phải là http/https, tối đa 500 ký tự).
movie.trailer_url.invalid = URL trailer không hợp lệ (phải là http/https, tối đa 500 ký tự).

# -----------------------------------------------------------------------------
# Error keys — Lookup / Authorization (HTTP 404 / 403)
# -----------------------------------------------------------------------------
movie.not_found = Không tìm thấy Phim.
movie.access_denied = Bạn không có quyền truy cập Phim này.

# -----------------------------------------------------------------------------
# Info / Warning keys
