<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${mode == 'edit'} ? 'Chỉnh sửa Chi nhánh' : 'Tạo Chi nhánh')}"></head>
<body class="min-h-screen bg-cinema-bg text-white">

<th:block th:replace="~{fragments/layout :: mobileToggle}"></th:block>
<nav th:replace="~{fragments/layout :: adminSidebar('branches')}"></nav>

<main class="hc-page">
    <div class="mx-auto max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="mb-8">
            <a th:href="${mode == 'edit'} ? @{|/admin/branches/${branchId}|} : @{/admin/branches}" class="mb-4 inline-flex text-sm text-cinema-muted no-underline hover:text-accent">← Quay lại</a>
            <h1 class="hc-page-title" th:text="${mode == 'edit'} ? 'Chỉnh sửa Chi nhánh' : 'Tạo Chi nhánh'">Tạo Chi nhánh</h1>
            <p class="hc-page-subtitle">Cập nhật thông tin vận hành, địa chỉ và giờ mở cửa.</p>
        </div>

        <section class="hc-card p-6 md:p-8">
            <div th:if="${infoKey != null}" class="mb-4 rounded-xl border border-info/30 bg-info/10 px-4 py-3 text-sm text-info" th:text="#{__${infoKey}__}">Không có thay đổi nào được lưu.</div>

            <form th:object="${branch}"
                  th:action="${mode == 'edit'} ? @{|/admin/branches/${branchId}|} : @{/admin/branches}"
                  method="post"
                  novalidate
                  class="space-y-5">

                <div th:if="${#fields.hasGlobalErrors()}" class="rounded-xl border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">
                    <strong>Không thể lưu thay đổi:</strong>
                    <ul class="mt-2 list-disc space-y-1 pl-5">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">global error</li>
                    </ul>
                </div>

                <div>
                    <label for="name" class="hc-label">Tên chi nhánh</label>
                    <input type="text" id="name" th:field="*{name}" maxlength="150" autocomplete="off" required
                           th:classappend="${#fields.hasErrors('name')} ? ' border-danger!' : ''"
                           class="hc-input">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 block text-xs text-danger">Lỗi tên chi nhánh</span>
                </div>

                <div>
                    <label for="address" class="hc-label">Địa chỉ</label>
                    <input type="text" id="address" th:field="*{address}" maxlength="255" autocomplete="off" required
                           th:classappend="${#fields.hasErrors('address')} ? ' border-danger!' : ''"
                           class="hc-input">
                    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 block text-xs text-danger">Lỗi địa chỉ</span>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="city" class="hc-label">Thành phố</label>
                        <input type="text" id="city" th:field="*{city}" maxlength="100" autocomplete="off" required
                               th:classappend="${#fields.hasErrors('city')} ? ' border-danger!' : ''"
                               class="hc-input">
                        <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="mt-1 block text-xs text-danger">Lỗi thành phố</span>
                    </div>

                    <div>
                        <label for="phone" class="hc-label">Số điện thoại</label>
                        <input type="text" id="phone" th:field="*{phone}" placeholder="0xxxxxxxxx hoặc +84xxxxxxxxx" maxlength="13" autocomplete="off" required
                               th:classappend="${#fields.hasErrors('phone')} ? ' border-danger!' : ''"
                               class="hc-input">
                        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 block text-xs text-danger">Lỗi số điện thoại</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="openingTime" class="hc-label">Giờ mở cửa</label>
                        <input type="time" id="openingTime" th:field="*{openingTime}" required
                               th:classappend="${#fields.hasErrors('openingTime')} ? ' border-danger!' : ''"
                               class="hc-input">
                        <span th:if="${#fields.hasErrors('openingTime')}" th:errors="*{openingTime}" class="mt-1 block text-xs text-danger">Lỗi giờ mở cửa</span>
                    </div>

                    <div>
                        <label for="closingTime" class="hc-label">Giờ đóng cửa</label>
                        <input type="time" id="closingTime" th:field="*{closingTime}" required
                               th:classappend="${#fields.hasErrors('closingTime')} ? ' border-danger!' : ''"
                               class="hc-input">
                        <span th:if="${#fields.hasErrors('closingTime')}" th:errors="*{closingTime}" class="mt-1 block text-xs text-danger">Lỗi giờ đóng cửa</span>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 border-t border-cinema-border pt-4">
                    <a class="hc-btn no-underline" th:href="${mode == 'edit'} ? @{|/admin/branches/${branchId}|} : @{/admin/branches}">Hủy</a>
                    <button type="submit" class="hc-btn hc-btn-primary" th:text="${mode == 'edit'} ? 'Lưu thay đổi' : 'Tạo mới'">Tạo mới</button>
                </div>
            </form>
        </section>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</main>

</body>
</html>
